# Isolated L5 case requiring both AI news discovery and official web research.
cases:
  - id: ai-news-web-search-pdf-positive
    name: Multi-agent AI news research delivers a referenced PDF
    task:
      scope:
        tenant: tenant-a
        project: project-a
        team: team-a
      taskType: agentscope
      inputJson:
        prompt: >-
          Research recent AI agent and Model Context Protocol industry developments.
          Create exactly two dependent subtasks. subtask 1 researches recent AI
          agent and MCP news, calls search_news and web_search, verifies one
          technical claim against official MCP documentation, preserves exact
          source URLs, and returns research notes as text without creating files.
          Subtask 2 depends on subtask 1 and returns a concise report with
          conclusion, news findings, official-documentation check, impact analysis
          and source list as text without creating files. After both subtasks
          succeed, the Leader creates the final downloadable PDF during aggregation.
          Do not invent
          requiredCapabilities; omit them because no executor capability registry
          is supplied. The Leader creates exactly one final PDF directly during
          aggregation; do not select or copy a child PDF. All user-facing report prose and
          PDF content must be in Simplified Chinese (简体中文); keep product names,
          tool names, source titles and URLs unchanged.
        requiredMcpTools:
          - plan_subtasks
        executorMcpTools:
          - search_news
          - web_search
        aggregatePrompt: >-
          Return only one JSON object with top-level summary and artifacts keys; put
          no plain Markdown outside the JSON object. Use childResults as source
          material and preserve dependency provenance. Call list_subtasks and
          get_task_result for each successful subtask. Create the complete final
          report as Simplified Chinese Markdown and call create_task_pdf_artifact
          exactly once with filename ai-agent-mcp-final-deliverable.pdf. The tool
          uploads the PDF directly to the parent task. Return an empty artifacts
          array because the PDF is a parent task file, not a child-file reference.
          If PDF creation fails, report delivery failure; do not claim success.
          Include the returned news links in the PDF source list. For the official
          documentation citation, copy a URL from a childSourceEvidence source entry
          whose `verified` field is true. If that entry is incomplete, use only the
          listed verified sources and do not infer omitted sources. Keep the complete
          final answer under 2,000 characters so the task result summary retains it.
          Put a concise conclusion first, followed immediately by a `Sources:` section.
          Include at least one full HTTP(S) URL copied verbatim from a successful
          web_search result on its own line, without Markdown link or code formatting.
          The final task result summary itself must contain that exact URL; including
          it only in the PDF or child results is insufficient. The aggregate leader
          must return the complete concise final answer rather than a completion notice,
          and make the final response's last non-empty line that same verbatim URL.
          Do not invent, shorten, or normalize URLs. Return the complete concise
          final answer inside summary and an empty artifacts array. Write the
          complete report and PDF content in Simplified Chinese (简体中文); keep
          product names, tool names, source titles and URLs unchanged. Do not use
          Markdown fences.
        aggregateMcpTools:
          - list_subtasks
          - get_task_result
          - create_task_pdf_artifact
      requiredCapabilities:
        - runtime-agentscope-v1
    assertions:
      - type: phase
        expected: SUCCEEDED
      - type: run_status
        expected: SUCCEEDED
      - type: dependency_success
        requireDependencies: true
      - type: dependency_handoff
      - type: required_tool
        name: search_news
      - type: required_tool
        name: web_search
      - type: required_tool
        name: create_task_pdf_artifact
      - type: tool_count
        name: create_task_pdf_artifact
        expected: 1
        parentRunOnly: true
      - type: source_citation
        allowUnverifiedCitations: true
      - type: artifact_pdf
        exactlyOne: true
        durable: true
        downloadable: true
    limits:
      timeoutSeconds: 360
