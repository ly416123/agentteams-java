# Core deterministic cases for AgentTeams. No credentials belong in this file.
cases:
  - id: mcp-web-search-title
    name: Web search returns MCP title
    task:
      scope:
        tenant: tenant-a
        project: project-a
        team: team-a
      # AgentScope is the L5 worker with the registered web_search MCP server.
      taskType: chat
      inputJson:
        prompt: >-
          Use the web_search MCP tool to find the official Model Context Protocol
          site and summarize what it is.
      requiredCapabilities:
        - runtime-agentscope-v1
    assertions:
      - type: phase
        expected: SUCCEEDED
      - type: required_tool
        name: web_search
      - type: output_contains
        value: Model Context Protocol
    limits:
      timeoutSeconds: 180

  - id: no-tool-simple-answer
    name: Simple answer does not call a search tool
    task:
      scope:
        tenant: tenant-a
        project: project-a
        team: team-a
      taskType: agentscope
      inputJson:
        prompt: "Answer exactly with: 2 + 2 = 4"
      requiredCapabilities: []
    assertions:
      - type: phase
        expected: SUCCEEDED
      - type: forbidden_tool
        name: web_search
      - type: output_contains
        value: 2 + 2 = 4
    limits:
      timeoutSeconds: 120

  - id: artifact-integrity
    name: Result artifacts have durable integrity metadata
    task:
      scope:
        tenant: tenant-a
        project: project-a
        team: team-a
      taskType: agentscope
      inputJson:
        prompt: Return a short answer and produce one JSON result artifact.
      requiredCapabilities: []
    assertions:
      - type: phase
        expected: SUCCEEDED
      - type: artifact_integrity
    limits:
      timeoutSeconds: 180

  - id: multi-agent-pdf-positive
    name: Multi-agent task delivers a referenced PDF
    task:
      scope:
        tenant: tenant-a
        project: project-a
        team: team-a
      taskType: agentscope
      inputJson:
        prompt: >-
          Research authoritative W3C guidance on accessible PDF documents. Plan the work
          and delegate research and drafting to dependent subtasks. Do not invent
          requiredCapabilities; leave them empty because no executor capability registry
          is supplied. Each executor must use web_search. Cite source references and
          preserve dependency result references. The second subtask drafts the final
          answer text only; it must not create a PDF. After all subtasks succeed, the
          aggregate leader creates exactly one downloadable PDF.
        requiredMcpTools:
          - plan_subtasks
        executorMcpTools:
          - web_search
        aggregatePrompt: >-
          Use childResults as the verified source material and preserve dependency
          provenance. Copy the citation URL from a childSourceEvidence source entry
          whose `verified` field is true. If that child entry is incomplete, use only
          the listed verified sources and do not infer omitted sources.
          Keep the complete final answer under 2,000 characters so the task
          result summary retains it. Put a concise conclusion first, followed immediately
          by a `Sources:` section. Include at least one full HTTP(S) URL copied verbatim
          from a successful web_search result on its own line, without Markdown link or
          code formatting. The final task result summary itself must contain that exact
          URL; including it only in the PDF or child results is insufficient. After
          creating the PDF, return the complete concise final answer rather than a
          completion notice, and make the final response's last non-empty line that same
          verbatim URL. Do not invent, shorten, or normalize URLs. The aggregate leader
          creates exactly one downloadable PDF containing the complete final answer.
        aggregateMcpTools:
          - create_task_pdf_artifact
      requiredCapabilities:
        - runtime-agentscope-v1
    assertions:
      - type: phase
        expected: SUCCEEDED
      - type: run_status
        expected: SUCCEEDED
      - type: dependency_success
        requireDependencies: true
      - type: dependency_handoff
      - type: required_tool
        name: web_search
      - type: source_citation
      - type: artifact_pdf
        exactlyOne: true
        durable: true
        downloadable: true
    limits:
      timeoutSeconds: 300

# Local deterministic fixtures are intentionally outside cases; they are consumed
# by unit tests only and must never be reported as L5 task executions.
offlineFixtures:
  - id: multi-agent-pdf-failed-tool
    assertions:
      - type: required_tool
        name: web_search
    expectedStatuses: [FAILED]
    observation:
      run: {id: fixture-run}
      eventCompleteness: COMPLETE
      events:
        - {eventId: c1, eventType: tool.called, sequence: 1, payload: {tool: web_search, sequence: 1, callId: search-1}}
        - {eventId: f1, eventType: tool.finished, sequence: 2, payload: {tool: web_search, sequence: 2, callId: search-1, ok: false}}
      result: {status: SUCCEEDED}
  - id: multi-agent-pdf-missing-dependency
    assertions:
      - {type: dependency_success}
      - {type: dependency_handoff}
    expectedStatuses: [INCONCLUSIVE, INCONCLUSIVE]
    observation:
      run: {id: fixture-run}
      events: []
      taskTree:
        - {taskId: child, dependencyIds: [missing-parent]}
      result: {status: SUCCEEDED}
  - id: multi-agent-pdf-corrupt-and-truncated
    assertions:
      - {type: artifact_pdf, exactlyOne: true, durable: true, downloadable: true}
      - {type: required_tool, name: web_search}
    expectedStatuses: [FAILED, INCONCLUSIVE]
    observation:
      run: {id: fixture-run}
      events: []
      evidenceCompleteness: {status: TRUNCATED, observedEventCount: 1001, eventLimit: 1000}
      result:
        status: SUCCEEDED
        artifacts:
          - name: report.pdf
            contentType: application/pdf
            storageRef: tasks/33333333-3333-3333-3333-333333333333/attempts/44444444-4444-4444-4444-444444444444/artifacts/report.pdf
            sizeBytes: 9
            sha256: 55e6967dae43099b5d6822df808b06e30454a2be93475a3d82ba612d8dd3bf29
            downloadUrl: https://storage.example/report.pdf?X-Amz-Signature=fixture
            contentBase64: bm90LWEtcGRm
  - id: multi-agent-pdf-invalid-handoff
    assertions:
      - {type: dependency_handoff}
    expectedStatuses: [FAILED]
    observation:
      run: {id: fixture-run}
      events: []
      taskTree:
        - {taskId: parent, status: SUCCEEDED, dependencyIds: []}
        - taskId: child
          status: SUCCEEDED
          dependencyIds: [parent]
          dependencyResults: {parent: "https://storage.example/result?token=secret"}
      result: {status: SUCCEEDED}
  - id: multi-agent-pdf-multiple-pdfs
    assertions:
      - {type: artifact_pdf, exactlyOne: true, durable: true, downloadable: true}
    expectedStatuses: [FAILED]
    observation:
      run: {id: fixture-run}
      events: []
      result:
        status: SUCCEEDED
        artifacts:
          - {name: one.pdf, contentType: application/pdf, storageRef: tasks/33333333-3333-3333-3333-333333333333/attempts/44444444-4444-4444-4444-444444444444/artifacts/one.pdf,
             sizeBytes: 9, sha256: 55e6967dae43099b5d6822df808b06e30454a2be93475a3d82ba612d8dd3bf29,
             downloadUrl: "https://storage.example/one.pdf?X-Amz-Signature=fixture", contentBase64: bm90LWEtcGRm}
          - {name: two.pdf, contentType: application/pdf, storageRef: tasks/33333333-3333-3333-3333-333333333333/attempts/44444444-4444-4444-4444-444444444444/artifacts/two.pdf,
             sizeBytes: 9, sha256: 55e6967dae43099b5d6822df808b06e30454a2be93475a3d82ba612d8dd3bf29,
             downloadUrl: "https://storage.example/two.pdf?X-Amz-Signature=fixture", contentBase64: bm90LWEtcGRm}
  - id: multi-agent-pdf-partial-tool
    assertions:
      - {type: required_tool, name: web_search}
    expectedStatuses: [INCONCLUSIVE]
    observation:
      run: {id: fixture-run}
      events:
        - {eventType: tool.called, sequence: 1, payload: {tool: web_search, sequence: 1, callId: search-1}}
        - {eventType: tool.finished, sequence: 2, payload: {tool: web_search, sequence: 2, callId: search-1, ok: true}}
        - {eventType: tool.called, sequence: 3, payload: {tool: web_search, sequence: 3, callId: search-2}}
      result: {status: SUCCEEDED}
  - id: multi-agent-pdf-failed-tool-truncated
    assertions:
      - {type: failed_tool, name: web_search}
    expectedStatuses: [FAILED]
    observation:
      run: {id: fixture-run}
      events:
        - {eventType: tool.called, sequence: 1, payload: {tool: web_search, sequence: 1, callId: search-1}}
        - {eventType: tool.finished, sequence: 2, payload: {tool: web_search, sequence: 2, callId: search-1, ok: false}}
      evidenceCompleteness: {status: TRUNCATED, observedEventCount: 1001, eventLimit: 1000}
      result: {status: SUCCEEDED}
