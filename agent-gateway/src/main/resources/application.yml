agentteams:
  gateway:
    grpc:
      tls:
        enabled: false
        certificate-chain: ""
        private-key: ""
        trust-certificate-collection: ""
    nats:
      enabled: false
      url: nats://localhost:4222
      subject: task.events.*
      durable: agent-gateway
      config-subject: agent.events.*
      config-durable: agent-gateway-config
      instance-id: ${AGENTTEAMS_GATEWAY_NATS_INSTANCE_ID:local}

management:
  tracing:
    enabled: ${AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED:false}
    sampling:
      probability: ${AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-unknown}] [trace:%X{traceId:-unknown} span:%X{spanId:-unknown}]"
