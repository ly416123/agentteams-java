agentteams:
  gateway:
    grpc:
      tls:
        enabled: false
        certificate-chain: ""
        private-key: ""
        trust-certificate-collection: ""
    nats:
      enabled: false
      url: nats://localhost:4222
      subject: task.events.*
      durable: agent-gateway
      config-subject: agent.events.*
      config-durable: agent-gateway-config
      instance-id: ${AGENTTEAMS_GATEWAY_NATS_INSTANCE_ID:local}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-unknown}]"
