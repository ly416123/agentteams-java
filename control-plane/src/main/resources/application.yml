spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

management:
  tracing:
    enabled: ${AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED:false}
    sampling:
      probability: ${AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT:}

  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,nats
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-unknown}] [trace:%X{traceId:-unknown} span:%X{spanId:-unknown}]"

agentteams:
  storage:
    enabled: false
    endpoint: http://minio:9000
    bucket: agentteams
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  nats:
    enabled: false
    url: nats://localhost:4222
  outbox:
    relay:
      enabled: false
      concurrency: 4
      batch-size: 16
      max-attempts: 10
      claim-lease: 30s
      base-retry-delay: 1s
      max-retry-delay: 5m
      poll-interval-ms: 1000
      shutdown-timeout: 30s
  scheduler:
    enabled: true
    poll-interval-ms: 1000
    lease-duration: 30s
    batch-size: 16
  scheduled-tasks:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 16
  webhook:
    transport:
      timeout: ${AGENTTEAMS_WEBHOOK_TRANSPORT_TIMEOUT:10s}
    scheduler:
      enabled: true
      poll-interval-ms: 1000
      lease-duration: 30s
      batch-size: 16
      max-attempts: 5
  artifact-retention:
    successful-task-retention: 30d
    failed-task-retention: 90d
    temporary-upload-retention: 2h
    legal-hold: false
    batch-size: 100
    cleanup-interval-ms: 300000
  sandbox:
    enabled: false
    provider: fake
    namespace: agentteams
    poll-interval-ms: 1000
    batch-size: 16
    renew-before: 5m
    renew-extension: 30m
    lost-after: 2m
    termination-grace-period: 2m
    operation-timeout: 2m
    max-provision-attempts: 5
    max-terminate-attempts: 10
    base-retry-delay: 1s
    max-retry-delay: 1m
  dashboard:
    alerts:
      scheduler:
        enabled: false
        poll-interval-ms: 60000
        lease-duration: 30s
        window: 24h
        max-projects-per-run: 100
        retry-delay: 1m
  usage:
    budget:
      scheduler:
        enabled: false
        poll-interval-ms: 60000
        lease-duration: 30s
        max-policies-per-run: 100
        retry-delay: 1m
    price-sync:
      enabled: false
      endpoint:
      connect-timeout: 2s
      request-timeout: 10s
      poll-interval-ms: 3600000
      lease-duration: 30s
      max-response-bytes: 262144
      max-quotes: 1000
      targets: []
  token-ledger:
    internal-token: ${AGENTTEAMS_TOKEN_LEDGER_INTERNAL_TOKEN:}
  security:
    api:
      enabled: false
    oidc:
      enabled: false
      issuer-uri: ""
      jwk-set-uri: ""
      audience: ""
      tenant-claim: tenant
      project-claim: project
      team-claim: team
      permissions-claim: permissions
  mcp:
    discovery:
      instance-id: ${AGENTTEAMS_MCP_DISCOVERY_INSTANCE_ID:${HOSTNAME:control-plane}}
      observation-ttl: ${AGENTTEAMS_MCP_DISCOVERY_OBSERVATION_TTL:2m}
  matrix:
    appservice:
      auth-enabled: false
      hs-token: ${AGENTTEAMS_MATRIX_APPSERVICE_HS_TOKEN:}
