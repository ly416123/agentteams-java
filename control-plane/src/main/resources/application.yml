management:
  tracing:
    enabled: ${AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED:false}
    sampling:
      probability: ${AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,nats
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-unknown}] [trace:%X{traceId:-unknown} span:%X{spanId:-unknown}]"

agentteams:
  storage:
    enabled: false
    endpoint: http://minio:9000
    bucket: agentteams
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  nats:
    enabled: false
    url: nats://localhost:4222
  outbox:
    relay:
      enabled: false
      concurrency: 4
      batch-size: 16
      max-attempts: 10
      claim-lease: 30s
      base-retry-delay: 1s
      max-retry-delay: 5m
      poll-interval-ms: 1000
      shutdown-timeout: 30s
  scheduler:
    enabled: true
    poll-interval-ms: 1000
    lease-duration: 30s
    batch-size: 16
  dashboard:
    alerts:
      scheduler:
        enabled: false
        poll-interval-ms: 60000
        lease-duration: 30s
        window: 24h
        max-projects-per-run: 100
        retry-delay: 1m
  security:
    api:
      enabled: false
    oidc:
      enabled: false
      issuer-uri: ""
      jwk-set-uri: ""
      audience: ""
      tenant-claim: tenant
      project-claim: project
      team-claim: team
      permissions-claim: permissions
  matrix:
    appservice:
      auth-enabled: false
      hs-token: ${AGENTTEAMS_MATRIX_APPSERVICE_HS_TOKEN:}
