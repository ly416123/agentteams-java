apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.agentteams.io
spec:
  group: agentteams.io
  scope: Namespaced
  names:
    plural: teams
    singular: team
    kind: Team
    shortNames: [agt]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [leaderRef, members, policy, workspaceRef, channelBindingRef]
              properties:
                leaderRef: {type: string}
                workspaceRef: {type: string}
                channelBindingRef: {type: string}
                members:
                  type: array
                  items:
                    type: object
                    required: [agentRef, role]
                    properties:
                      agentRef: {type: string}
                      role: {type: string}
                      capabilities:
                        type: array
                        items: {type: string}
                policy:
                  type: object
                  required: [maxConcurrentTasks]
                  properties:
                    maxConcurrentTasks: {type: integer, minimum: 1}
                    requireApproval: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                observedGeneration: {type: integer, format: int64}
                message: {type: string}
      subresources:
        status: {}
