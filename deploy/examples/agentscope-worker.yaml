# Replace agentId with the UUID returned by POST /api/v1/agents before applying.
# The Operator injects AGENTTEAMS_AGENT_ID from spec.agentId.
apiVersion: agentteams.io/v1alpha1
kind: Worker
metadata:
  name: agentscope-worker
  namespace: agentteams
spec:
  agentId: "00000000-0000-0000-0000-000000000001"
  runtime: AGENTSCOPE
  image: ghcr.io/ly416123/agentteams-agent-worker:latest
  replicas: 1
  env:
    AGENTTEAMS_GATEWAY_HOST: agentteams-agentteams-java-gateway
    AGENTTEAMS_GATEWAY_PORT: "9090"
    AGENTTEAMS_CONFIG_MANIFEST_BASE_URL: http://agentteams-agentteams-java-control-plane:8080
    AGENTTEAMS_CONFIG_DIRECTORY: /tmp/agentteams-config
    AGENTTEAMS_MAX_CONFIG_FILE_BYTES: "16777216"
    AGENTTEAMS_RUNTIME: "AGENTSCOPE"
    AGENTTEAMS_MODEL_PROVIDER: "deepseek"
    AGENTTEAMS_MODEL: "deepseek:deepseek-chat"
    AGENTTEAMS_MODEL_MAX_TOKENS: "1024"
    AGENTTEAMS_QUOTA_REMOTE_ENABLED: "false"
    AGENTTEAMS_QUOTA_TIMEOUT_SECONDS: "3"
    AGENTTEAMS_SCOPE_TENANT: ""
    AGENTTEAMS_SCOPE_PROJECT: ""
    AGENTTEAMS_ARTIFACT_UPLOAD_ENABLED: "false"
    AGENTTEAMS_ARTIFACT_UPLOAD_TIMEOUT_SECONDS: "5"
    AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED: "false"
    AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY: "0.1"
    AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT: ""
    AGENTTEAMS_OBSERVABILITY_SERVICE_NAME: agentteams-agent-worker
