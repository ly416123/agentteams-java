apiVersion: agentteams.io/v1alpha1
kind: TaskSandbox
metadata:
  name: task-sandbox-l5-hardened
  namespace: agentteams
spec:
  taskId: "00000000-0000-0000-0000-000000000102"
  attemptId: "00000000-0000-0000-0000-000000000202"
  idempotencyKey: "sandbox:l5-hardened-example"
  profile: HARDENED
  runtimeClassName: kata-qemu
  image: ghcr.io/ly416123/agentteams-task-sandbox:latest
  ttlSeconds: 300
  template: python-untrusted
