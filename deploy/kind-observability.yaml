apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agentteams
  labels:
    app.kubernetes.io/part-of: agentteams
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/agentteams-alerts.yml
    scrape_configs:
      - job_name: control-plane
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agentteams]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: agentteams-control-plane
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
      - job_name: gateway
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [agentteams]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: agentteams-gateway
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
  agentteams-alerts.yml: |
    groups:
      - name: agentteams.recovery
        rules:
          - alert: AgentTeamsLeaseRecovery
            expr: increase(agentteams_tasks_leases_expired_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams task leases are expiring
              description: One or more task leases expired in the last 10 minutes and required recovery.
          - alert: AgentTeamsGatewayCommandDeduplication
            expr: increase(agentteams_gateway_commands_deduplicated_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams Gateway is deduplicating commands
              description: Outbox redelivery or Gateway retry caused duplicate command events in the last 10 minutes.
          - alert: AgentTeamsGatewayRejectedEvents
            expr: increase(agentteams_gateway_events_rejected_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams Gateway rejected inbound events
              description: The Gateway rejected one or more inbound Agent events in the last 10 minutes.
          - alert: AgentTeamsOutboxRetries
            expr: increase(agentteams_outbox_retries_total[10m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams Outbox events are retrying
              description: At least one Outbox event failed delivery in the last 10 minutes.
          - alert: AgentTeamsOutboxBacklog
            expr: agentteams_outbox_backlog > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams Outbox backlog is not draining
              description: One or more non-terminal Outbox events have remained in the relay backlog for 10 minutes.
          - alert: AgentTeamsOutboxStalled
            expr: agentteams_outbox_backlog > 0 and agentteams_outbox_oldest_pending_age_seconds > 300
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: AgentTeams Outbox has a stalled oldest event
              description: The oldest non-terminal Outbox event has been pending for more than five minutes.
          - alert: AgentTeamsOutboxDeadLettered
            expr: increase(agentteams_outbox_dead_lettered_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: AgentTeams Outbox event moved to dead-letter
              description: At least one Outbox event exhausted its retry budget in the last 5 minutes.
          - alert: AgentTeamsGatewayNatsConsumerErrors
            expr: increase(agentteams_gateway_nats_consumer_errors_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: AgentTeams Gateway NATS consumer is rejecting events
              description: The Gateway NATS consumer encountered event processing errors in the last 5 minutes.
          - alert: AgentTeamsGatewayConnectionChurn
            expr: increase(agentteams_gateway_connections_replaced_total[10m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: AgentTeams Gateway connections are churning
              description: More than three active Agent streams were replaced in the last ten minutes.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: agentteams
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: agentteams
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentteams
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: agentteams
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentteams
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: agentteams
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentteams
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: agentteams
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agentteams
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: agentteams
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: agentteams-alerts.yml
                path: agentteams-alerts.yml
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: agentteams
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: agentteams
  labels:
    app.kubernetes.io/part-of: agentteams
type: Opaque
stringData:
  username: admin
  password: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: agentteams
  labels:
    app.kubernetes.io/part-of: agentteams
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: agentteams
  labels:
    app.kubernetes.io/part-of: agentteams
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: AgentTeams
        orgId: 1
        folder: AgentTeams
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  agentteams-overview.json: |
    {
      "uid": "agentteams-overview",
      "title": "AgentTeams Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Outbox backlog", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(agentteams_outbox_backlog)", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}},
        {"id": 2, "type": "timeseries", "title": "Outbox retry rate", "gridPos": {"h": 5, "w": 9, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(agentteams_outbox_retries_total[5m]))", "legendFormat": "retries/sec", "refId": "A"}]},
        {"id": 3, "type": "stat", "title": "Dead-letter events (5m)", "gridPos": {"h": 5, "w": 6, "x": 15, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(increase(agentteams_outbox_dead_lettered_total[5m]))", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}},
        {"id": 6, "type": "stat", "title": "Oldest Outbox event age", "gridPos": {"h": 5, "w": 3, "x": 21, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "max(agentteams_outbox_oldest_pending_age_seconds)", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 300}, {"color": "red", "value": 900}]}}, "overrides": []}},
        {"id": 4, "type": "timeseries", "title": "Gateway active connections", "gridPos": {"h": 7, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(agentteams_gateway_connections_active)", "legendFormat": "active", "refId": "A"}]},
        {"id": 5, "type": "timeseries", "title": "Gateway NATS consumer errors", "gridPos": {"h": 7, "w": 8, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(agentteams_gateway_nats_consumer_errors_total[5m]))", "legendFormat": "errors/sec", "refId": "A"}]},
        {"id": 7, "type": "timeseries", "title": "Gateway connection replacements", "gridPos": {"h": 7, "w": 4, "x": 20, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(agentteams_gateway_connections_replaced_total[5m]))", "legendFormat": "replacements/sec", "refId": "A"}]}
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: agentteams
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: agentteams
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: agentteams
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: provider.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards
            items:
              - key: provider.yaml
                path: provider.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: agentteams-overview.json
                path: agentteams-overview.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: agentteams
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: agentteams
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentteams
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
      file/ci:
        path: /var/lib/otelcol/traces.jsonl
        format: json
        append: true
        flush_interval: 1s
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug, file/ci]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: agentteams
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: agentteams
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
            - name: trace-snapshot
              mountPath: /var/lib/otelcol
        - name: trace-reader
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c", "import time; time.sleep(10**9)"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: trace-snapshot
              mountPath: /var/lib/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: trace-snapshot
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentteams
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
