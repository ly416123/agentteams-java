apiVersion: v1
kind: Namespace
metadata:
  name: agentteams
---
apiVersion: v1
kind: Secret
metadata:
  name: agentteams-database
  namespace: agentteams
type: Opaque
stringData:
  username: agentteams
  password: agentteams-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: agentteams
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: agentteams
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: agentteams
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agentteams-database
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentteams-database
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: agentteams
spec:
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: agentteams
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: agentteams
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          args: ["--jetstream"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: agentteams
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-stream-bootstrap
  namespace: agentteams
  labels:
    app.kubernetes.io/part-of: agentteams
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-stream-bootstrap
        app.kubernetes.io/part-of: agentteams
    spec:
      restartPolicy: OnFailure
      containers:
        - name: nats-admin
          image: natsio/nats-box:0.14.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              until nats --server nats://nats:4222 stream ls >/dev/null 2>&1; do sleep 2; done;
              nats --server nats://nats:4222 stream info TASK_EVENTS >/dev/null 2>&1 ||
              nats --server nats://nats:4222 stream add TASK_EVENTS --subjects task.events.* --storage file --retention limits
              --max-msgs=-1 --max-bytes=-1 --max-age=0 --max-msg-size=-1 --discard old
              --replicas 1 --defaults;
              nats --server nats://nats:4222 stream info AGENT_EVENTS >/dev/null 2>&1 ||
              nats --server nats://nats:4222 stream add AGENT_EVENTS --subjects agent.events.* --storage file --retention limits
              --max-msgs=-1 --max-bytes=-1 --max-age=0 --max-msg-size=-1 --discard old
              --replicas 1 --defaults
