apiVersion: v1
kind: Secret
metadata:
  name: matrix-appservice
  namespace: agentteams
type: Opaque
stringData:
  as-token: agentteams-as-token-dev
  hs-token: agentteams-hs-token-dev
  agentteams-registration.yaml: |
    id: agentteams
    url: http://agentteams-agentteams-java-control-plane:8080
    as_token: agentteams-as-token-dev
    hs_token: agentteams-hs-token-dev
    sender_localpart: agentteams
    namespaces:
      users:
        - exclusive: true
          regex: '@agentteams_.*:agentteams\.test'
      aliases:
        - exclusive: true
          regex: '#agentteams_.*:agentteams\.test'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tuwunel-config
  namespace: agentteams
data:
  tuwunel.toml: |
    [global]
    server_name = "agentteams.test"
    database_path = "/var/lib/tuwunel"
    address = ["0.0.0.0"]
    port = 8008
    allow_registration = false
    appservice_dir = "/etc/tuwunel/appservices"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-data
  namespace: agentteams
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
  namespace: agentteams
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tuwunel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuwunel
        app.kubernetes.io/part-of: agentteams
    spec:
      enableServiceLinks: false
      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:v1.8.2
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/tuwunel/tuwunel.toml"]
          ports:
            - name: client
              containerPort: 8008
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: client
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/tuwunel
            - name: config
              mountPath: /etc/tuwunel/tuwunel.toml
              subPath: tuwunel.toml
            - name: registration
              mountPath: /etc/tuwunel/appservices/agentteams-registration.yaml
              subPath: agentteams-registration.yaml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tuwunel-data
        - name: config
          configMap:
            name: tuwunel-config
        - name: registration
          secret:
            secretName: matrix-appservice
---
apiVersion: v1
kind: Service
metadata:
  name: tuwunel
  namespace: agentteams
  labels:
    app.kubernetes.io/name: tuwunel
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: tuwunel
  ports:
    - name: client
      port: 8008
      targetPort: client
