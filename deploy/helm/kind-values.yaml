images:
  controlPlane: ghcr.io/ly416123/agentteams-control-plane:latest
  gateway: ghcr.io/ly416123/agentteams-agent-gateway:latest
  operator: ghcr.io/ly416123/agentteams-operator:latest
console:
  enabled: true
  image: ghcr.io/ly416123/agentteams-console:latest
  config:
    apiBasePath: /api
    oidcIssuer: http://127.0.0.1:18082/realms/agentteams
    oidcClientId: agentteams-api
manager:
  enabled: true
  image: ghcr.io/ly416123/agentteams-manager:latest
  existingSecret: agentteams-manager
  conversation:
    runtime: qwenpaw
    qwenpawEndpoint: http://qwenpaw-conversation-mock:8080
    qwenpawAgentId: default
    qwenpawEgressPort: 8080
  security:
    enabled: true
    issuerUri: http://127.0.0.1:18082/realms/agentteams
    jwkSetUri: http://keycloak:8080/realms/agentteams/protocol/openid-connect/certs
    audience: agentteams-api
imagePullPolicy: IfNotPresent
controlPlane:
  env:
    AGENTTEAMS_QUOTA_INTERNAL_TOKEN: kind-quota-internal
    # Keep dashboard alert acceptance enabled across every Kind Helm upgrade,
    # including OIDC reinstall and local image refreshes.
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_ENABLED: "true"
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_POLL_INTERVAL_MS: "1000"
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_LEASE_DURATION: 30s
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_WINDOW: 24h
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_MAX_PROJECTS_PER_RUN: "100"
    AGENTTEAMS_DASHBOARD_ALERTS_SCHEDULER_RETRY_DELAY: 2s
    AGENTTEAMS_DASHBOARD_ALERTS_NOTIFICATION_ENABLED: "true"
    AGENTTEAMS_DASHBOARD_ALERTS_NOTIFICATION_WEBHOOK_URL: http://dashboard-alert-receiver:8080/alerts
    AGENTTEAMS_DASHBOARD_ALERTS_NOTIFICATION_TIMEOUT: 3s
  scheduler:
    # GitHub-hosted runners can take longer than the production default to
    # reconnect the Worker and complete the first deterministic model call.
    # Keep the recovery tests meaningful without creating a false second
    # attempt from a short lease; the lease-recovery test expires leases
    # explicitly and is unaffected by this value.
    leaseDuration: 10m
storage:
  enabled: true
  endpoint: http://minio:9000
  # The acceptance flow port-forwards MinIO to the browser host. Explicit
  # region below keeps presigning independent from this browser-only address.
  presignEndpoint: http://127.0.0.1:19000
  region: us-east-1
  bucket: agentteams
  existingSecret: agentteams-storage
observability:
  serviceMonitor:
    enabled: false
operator:
  replicas: 2
  internalToken: kind-quota-internal
sandbox:
  enabled: false
  provider: fake
gateway:
  quota:
    remoteEnabled: true
    internalToken: kind-quota-internal
  workerOperations:
    remoteEnabled: true
    internalToken: kind-quota-internal
networkPolicy:
  dashboardAlertReceiver:
    enabled: true
  # Kind's kindnet evaluates the Kubernetes API path after node-level DNAT;
  # allow only API HTTPS ports while keeping all other egress restrictions.
  kubernetesApiAllowAllEgress: true
  kubernetesApiCIDR: 10.96.0.0/12
  kubernetesApiEndpointCIDR: 172.18.0.2/32
  kubernetesApiEndpointPort: 6443
