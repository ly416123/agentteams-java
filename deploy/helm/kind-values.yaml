images:
  controlPlane: ghcr.io/ly416123/agentteams-control-plane:latest
  gateway: ghcr.io/ly416123/agentteams-agent-gateway:latest
  operator: ghcr.io/ly416123/agentteams-operator:latest
console:
  enabled: true
  image: ghcr.io/ly416123/agentteams-console:latest
  config:
    apiBasePath: /api
    oidcIssuer: http://127.0.0.1:18082/realms/agentteams
    oidcClientId: agentteams-api
manager:
  enabled: true
  image: ghcr.io/ly416123/agentteams-manager:latest
  existingSecret: agentteams-manager
  conversation:
    runtime: qwenpaw
    qwenpawEndpoint: http://qwenpaw-conversation-mock:8080
    qwenpawAgentId: default
  security:
    enabled: true
    issuerUri: http://keycloak:8080/realms/agentteams
    jwkSetUri: http://keycloak:8080/realms/agentteams/protocol/openid-connect/certs
    audience: agentteams-api
imagePullPolicy: IfNotPresent
controlPlane:
  env:
    AGENTTEAMS_QUOTA_INTERNAL_TOKEN: kind-quota-internal
  scheduler:
    # GitHub-hosted runners can take longer than the production default to
    # reconnect the Worker and complete the first deterministic model call.
    # Keep the recovery tests meaningful without creating a false second
    # attempt from a short lease; the lease-recovery test expires leases
    # explicitly and is unaffected by this value.
    leaseDuration: 10m
storage:
  enabled: true
  endpoint: http://minio:9000
  bucket: agentteams
  existingSecret: agentteams-storage
observability:
  serviceMonitor:
    enabled: false
operator:
  replicas: 2
  internalToken: kind-quota-internal
sandbox:
  enabled: false
  provider: fake
gateway:
  quota:
    remoteEnabled: true
    internalToken: kind-quota-internal
  workerOperations:
    remoteEnabled: true
    internalToken: kind-quota-internal
networkPolicy:
  dashboardAlertReceiver:
    enabled: true
  # Kind's kindnet evaluates the Kubernetes API path after node-level DNAT;
  # allow only API HTTPS ports while keeping all other egress restrictions.
  kubernetesApiAllowAllEgress: true
  kubernetesApiCIDR: 10.96.0.0/12
  kubernetesApiEndpointCIDR: 172.18.0.2/32
  kubernetesApiEndpointPort: 6443
