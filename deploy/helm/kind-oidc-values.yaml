controlPlane:
  security:
    apiEnabled: true
    oidc:
      enabled: true
      issuerUri: http://keycloak:8080/realms/agentteams
      jwkSetUri: http://keycloak:8080/realms/agentteams/protocol/openid-connect/certs
      audience: agentteams-api
      tenantClaim: tenant
      projectClaim: project
      teamClaim: team
      permissionsClaim: permissions

networkPolicy:
  # Keycloak is reached through the in-cluster pod selector; keep the optional
  # external fallback restricted to a documentation CIDR.
  oidcEgressCIDR: 198.51.100.0/24
  oidcEgressPort: 443
