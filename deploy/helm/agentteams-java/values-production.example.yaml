# Copy this file to an environment-owned values file and replace every
# RELEASE_TAG/placeholder before installing. Do not commit rendered Secrets.
images:
  controlPlane: ghcr.io/ly416123/agentteams-control-plane:RELEASE_TAG
  gateway: ghcr.io/ly416123/agentteams-agent-gateway:RELEASE_TAG
  operator: ghcr.io/ly416123/agentteams-operator:RELEASE_TAG
ingress:
  enabled: false
  mode: INGRESS
  className: nginx
  host: api.example.com
  tlsSecretName: agentteams-api-tls
  annotations: {}
  gatewayClassName: ""
imagePullPolicy: IfNotPresent
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: agentteams

controlPlane:
  replicas: 3
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  security:
    apiEnabled: true
    secretResolver:
      backend: VALIDATION_ONLY
    oidc:
      enabled: true
      issuerUri: https://idp.example.com/realms/agentteams
      jwkSetUri: https://idp.example.com/realms/agentteams/protocol/openid-connect/certs
      audience: agentteams-api
      tenantClaim: tenant
      projectClaim: project
      teamClaim: team
      permissionsClaim: permissions
  matrix:
    appservice:
      authEnabled: true
      hsTokenSecret: agentteams-matrix-appservice
      hsTokenKey: hs-token
  env:
    SPRING_PROFILES_ACTIVE: k8s
    AGENTTEAMS_NATS_ENABLED: "true"
    AGENTTEAMS_OUTBOX_RELAY_ENABLED: "true"
    AGENTTEAMS_ARTIFACT_RETENTION_SUCCESSFUL_TASK_RETENTION: "30d"
    AGENTTEAMS_ARTIFACT_RETENTION_FAILED_TASK_RETENTION: "90d"
    AGENTTEAMS_ARTIFACT_RETENTION_TEMPORARY_UPLOAD_RETENTION: "2h"
    AGENTTEAMS_ARTIFACT_RETENTION_LEGAL_HOLD: "false"
    AGENTTEAMS_ARTIFACT_RETENTION_BATCH_SIZE: "100"
    AGENTTEAMS_ARTIFACT_RETENTION_CLEANUP_INTERVAL_MS: "300000"
    AGENTTEAMS_TASK_STATE_CONSISTENCY_ENABLED: "true"
    AGENTTEAMS_TASK_STATE_CONSISTENCY_RECONCILE_INTERVAL_MS: "60000"
    AGENTTEAMS_TASK_STATE_CONSISTENCY_LEASE_DURATION: "30s"
    AGENTTEAMS_TASK_STATE_CONSISTENCY_LOOKBACK: "24h"
    AGENTTEAMS_TASK_STATE_CONSISTENCY_BATCH_SIZE: "100"
    AGENTTEAMS_AGENT_PRESENCE_CONSISTENCY_ENABLED: "true"
    AGENTTEAMS_AGENT_PRESENCE_CONSISTENCY_RECONCILE_INTERVAL_MS: "60000"
    AGENTTEAMS_AGENT_PRESENCE_CONSISTENCY_LEASE_DURATION: "30s"
    AGENTTEAMS_AGENT_PRESENCE_CONSISTENCY_STALE_AFTER: "2m"
    AGENTTEAMS_AGENT_PRESENCE_CONSISTENCY_BATCH_SIZE: "100"
    AGENTTEAMS_TEAM_DEPLOYMENT_PENDING_TIMEOUT_ENABLED: "true"
    AGENTTEAMS_TEAM_DEPLOYMENT_PENDING_TIMEOUT_RECONCILE_INTERVAL_MS: "60000"
    AGENTTEAMS_TEAM_DEPLOYMENT_PENDING_TIMEOUT_LEASE_DURATION: "30s"
    AGENTTEAMS_TEAM_DEPLOYMENT_PENDING_TIMEOUT_PENDING_TIMEOUT: "10m"
    AGENTTEAMS_TEAM_DEPLOYMENT_PENDING_TIMEOUT_BATCH_SIZE: "100"

gateway:
  replicas: 3
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  tls:
    enabled: true
    secretName: agentteams-gateway-mtls
    mountPath: /etc/agentteams/gateway-tls
    certificateChainPath: /etc/agentteams/gateway-tls/tls.crt
    privateKeyPath: /etc/agentteams/gateway-tls/tls.key
    trustCertificateCollectionPath: /etc/agentteams/gateway-tls/ca.crt
  env:
    AGENTTEAMS_GATEWAY_GRPC_PORT: "9090"
    AGENTTEAMS_GATEWAY_NATS_ENABLED: "true"
    AGENTTEAMS_GATEWAY_NATS_URL: nats://nats.example.internal:4222

operator:
  replicas: 2
  leaderElection:
    enabled: true
    leaseName: agentteams-operator

manager:
  enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

database:
  jdbcUrl: jdbc:postgresql://postgresql.example.internal:5432/agentteams
  username: agentteams
  existingSecret: agentteams-database

storage:
  enabled: true
  endpoint: https://s3.example.internal
  presignEndpoint: ""
  region: ""
  bucket: agentteams
  existingSecret: agentteams-storage

nats:
  url: nats://nats.example.internal:4222

availability:
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

networkPolicy:
  enabled: true
  egressMode: CIDR
  allowPublicInternet: false
  # Replace documentation CIDRs with the private ranges or egress addresses
  # owned by the target environment. Do not use 0.0.0.0/0 or ::/0.
  external:
    postgresql: [{cidr: 198.51.100.0/24, port: 5432}]
    nats: [{cidr: 198.51.101.0/24, port: 4222}]
    objectStorage: [{cidr: 198.51.102.0/24, port: 443}]
    otlp: [{cidr: 198.51.103.0/24, port: 443}]
    oidc: [{cidr: 198.51.104.0/24, port: 443}]
    matrix: []
    modelProviders: []
  oidcEgressPort: 443
  oidcEgressCIDR: 198.51.104.0/24
  kubernetesApiAllowAllEgress: false


observability:
  tracing:
    enabled: true
    samplingProbability: 0.1
    otlpEndpoint: https://otel-collector.telemetry.example.com/v1/traces
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: prometheus
  prometheusRule:
    enabled: true
    labels:
      release: prometheus
