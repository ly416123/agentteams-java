apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasksandboxes.agentteams.io
spec:
  group: agentteams.io
  scope: Namespaced
  names:
    plural: tasksandboxes
    singular: tasksandbox
    kind: TaskSandbox
    shortNames: [atsb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [taskId, attemptId, profile, image, ttlSeconds]
              properties:
                taskId: { type: string, minLength: 1 }
                attemptId: { type: string, minLength: 1 }
                profile:
                  type: string
                  enum: [ISOLATED, HARDENED]
                runtimeClassName: { type: string, maxLength: 63 }
                image: { type: string, minLength: 1 }
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }
                terminationRequested: { type: boolean }
                resources:
                  type: object
                  additionalProperties: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                providerSandboxId: { type: string }
                endpointRef: { type: string }
                observedGeneration: { type: integer, format: int64 }
                message: { type: string }
      subresources:
        status: {}
