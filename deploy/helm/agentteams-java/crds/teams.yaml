apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teams.agentteams.io
spec:
  group: agentteams.io
  scope: Namespaced
  names: { plural: teams, singular: team, kind: Team, shortNames: [agt] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [leaderRef, members, policy, workspaceRef, channelBindingRef]
              properties:
                leaderRef: { type: string }
                workspaceRef: { type: string }
                channelBindingRef: { type: string }
                members: { type: array, items: { type: object } }
                policy: { type: object }
            status: { type: object }
      subresources: { status: {} }
