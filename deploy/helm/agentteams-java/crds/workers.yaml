apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workers.agentteams.io
spec:
  group: agentteams.io
  scope: Namespaced
  names: { plural: workers, singular: worker, kind: Worker, shortNames: [atw] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agentId, runtime, image]
              properties:
                agentId: { type: string }
                runtime: { type: string }
                image: { type: string }
                replicas: { type: integer, minimum: 0, default: 1 }
                env: { type: object, additionalProperties: { type: string } }
                tlsSecret: { type: string }
                specDigest: { type: string }
                configRevision: { type: string }
                secretGeneration: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                observedGeneration: { type: integer, format: int64 }
                readyReplicas: { type: integer }
                message: { type: string }
                observedSpecDigest: { type: string }
                observedRuntime: { type: string }
                observedConfigRevision: { type: string }
                observedSecretGeneration: { type: string }
      subresources: { status: {} }
