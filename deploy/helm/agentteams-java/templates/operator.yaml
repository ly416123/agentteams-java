apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentteams-operator }
    spec:
      serviceAccountName: {{ include "agentteams-java.operatorServiceAccountName" . }}
      containers:
        - name: operator
          image: {{ .Values.images.operator }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: AGENTTEAMS_OPERATOR_LEADER_ELECTION
              value: {{ .Values.operator.leaderElection.enabled | quote }}
            - name: AGENTTEAMS_OPERATOR_LEASE_NAME
              value: {{ .Values.operator.leaderElection.leaseName | quote }}
            - name: AGENTTEAMS_OPERATOR_LEASE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: AGENTTEAMS_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: AGENTTEAMS_SANDBOX_RUNTIMECLASS_ISOLATED
              value: {{ .Values.sandbox.runtimeClasses.isolated | quote }}
            - name: AGENTTEAMS_SANDBOX_RUNTIMECLASS_HARDENED
              value: {{ .Values.sandbox.runtimeClasses.hardened | quote }}
            - name: AGENTTEAMS_SANDBOX_PROVIDER
              value: {{ .Values.sandbox.provider | quote }}
            - name: AGENTTEAMS_SANDBOX_ENABLED
              value: {{ .Values.sandbox.enabled | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
