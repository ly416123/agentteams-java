apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-operator }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentteams-operator
        app.kubernetes.io/part-of: agentteams
    spec:
      serviceAccountName: {{ include "agentteams-java.operatorServiceAccountName" . }}
      securityContext:
{{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
{{- toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: operator
          image: {{ .Values.images.operator }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
{{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: AGENTTEAMS_OPERATOR_LEADER_ELECTION
              value: {{ .Values.operator.leaderElection.enabled | quote }}
            - name: AGENTTEAMS_OPERATOR_LEASE_NAME
              value: {{ .Values.operator.leaderElection.leaseName | quote }}
            - name: AGENTTEAMS_OPERATOR_LEASE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: AGENTTEAMS_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: AGENTTEAMS_CONTROL_PLANE_URL
              value: {{ default (printf "http://%s-control-plane:%d" (include "agentteams-java.fullname" .) (int .Values.controlPlane.port)) .Values.operator.controlPlaneUrl | quote }}
            - name: AGENTTEAMS_OPERATOR_INTERNAL_TOKEN
{{- if .Values.operator.internalTokenSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.operator.internalTokenSecret | quote }}
                  key: {{ .Values.operator.internalTokenKey | quote }}
{{- else }}
              value: {{ .Values.operator.internalToken | quote }}
{{- end }}
            - name: AGENTTEAMS_SANDBOX_RUNTIMECLASS_ISOLATED
              value: {{ .Values.sandbox.runtimeClasses.isolated | quote }}
            - name: AGENTTEAMS_SANDBOX_RUNTIMECLASS_HARDENED
              value: {{ .Values.sandbox.runtimeClasses.hardened | quote }}
            - name: AGENTTEAMS_SANDBOX_PROVIDER
              value: {{ .Values.sandbox.provider | quote }}
            - name: AGENTTEAMS_SANDBOX_ENABLED
              value: {{ .Values.sandbox.enabled | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
