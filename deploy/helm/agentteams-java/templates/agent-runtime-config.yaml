apiVersion: v1
kind: ConfigMap
metadata:
  # WorkerResourceFactory creates the actual Worker Deployment and consumes
  # this namespace-scoped stable ConfigMap by name.
  name: agentteams-java-agent-runtime
  labels:
    app.kubernetes.io/part-of: agentteams
data:
  AGENTTEAMS_RUNTIME_DEFAULT: {{ .Values.agentRuntime.default | quote }}
  AGENTTEAMS_AGENTSCOPE_ENABLED: {{ .Values.agentRuntime.agentScope.enabled | quote }}
  AGENTTEAMS_AGENTSCOPE_ROLLOUT_PERCENTAGE: {{ .Values.agentRuntime.agentScope.rolloutPercentage | quote }}
  AGENTTEAMS_AGENTSCOPE_AGENT_ALLOWLIST: {{ join "," .Values.agentRuntime.agentScope.agentAllowlist | quote }}
  AGENTTEAMS_AGENTSCOPE_TEAM_ALLOWLIST: {{ join "," .Values.agentRuntime.agentScope.teamAllowlist | quote }}
  AGENTTEAMS_AGENTSCOPE_TENANT_ALLOWLIST: {{ join "," .Values.agentRuntime.agentScope.tenantAllowlist | quote }}
