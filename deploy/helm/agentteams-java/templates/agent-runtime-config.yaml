apiVersion: v1
kind: ConfigMap
metadata:
  # WorkerResourceFactory creates the actual Worker Deployment and consumes
  # this namespace-scoped stable ConfigMap by name.
  name: agentteams-java-agent-runtime
  labels:
    app.kubernetes.io/part-of: agentteams
data:
  AGENTTEAMS_ARTIFACT_UPLOAD_ENABLED: {{ .Values.agentRuntime.artifactUploadEnabled | quote }}
  AGENTTEAMS_ARTIFACT_UPLOAD_TIMEOUT_SECONDS: "5"
