apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["workers", "teams"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentteams.io"]
    resources: ["workers"]
    verbs: ["patch"]
  - apiGroups: ["agentteams.io"]
    resources: ["tasksandboxes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["agentteams.io"]
    resources: ["tasksandboxes/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["agentteams.io"]
    resources: ["workers/status", "teams/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentteams-java.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if or .Values.controlPlane.teamSync.enabled (eq .Values.controlPlane.security.secretResolver.backend "EXTERNAL_SECRETS") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
  namespace: {{ .Release.Namespace }}
rules:
{{- if .Values.controlPlane.teamSync.enabled }}
  - apiGroups: ["agentteams.io"]
    resources: ["teams"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq .Values.controlPlane.security.secretResolver.backend "EXTERNAL_SECRETS" }}
  # Keep External Secrets reads namespace-scoped and metadata-only. The
  # resolver never needs Secret list/watch or data mutation permissions.
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - externalsecrets/status
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
