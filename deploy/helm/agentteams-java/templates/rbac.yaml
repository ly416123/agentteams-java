apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["workers", "teams", "tasksandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentteams.io"]
    resources: ["workers/status", "teams/status", "tasksandboxes/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentteams-java.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controlPlane.teamSync.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["teams"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
