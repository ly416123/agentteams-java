apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["workers", "workers/status", "teams", "teams/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentteams-java.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.controlPlane.teamSync.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["teams"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentteams-java.fullname" . }}-control-plane-team-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "agentteams-java.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
