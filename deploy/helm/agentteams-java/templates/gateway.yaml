apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
  labels:
    app.kubernetes.io/part-of: agentteams
{{ if .Values.gateway.tls.enabled }}  annotations:
    secret.reloader.stakater.com/reload: {{ .Values.gateway.tls.secretName | quote }}
{{ end }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentteams-gateway }
    spec:
      serviceAccountName: {{ include "agentteams-java.gatewayServiceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: grpc, containerPort: {{ .Values.gateway.port }} }
            - { name: http, containerPort: {{ .Values.gateway.httpPort }} }
          env:
            - name: AGENTTEAMS_GATEWAY_GRPC_PORT
              value: {{ .Values.gateway.port | quote }}
            - name: AGENTTEAMS_GATEWAY_GRPC_TLS_ENABLED
              value: {{ .Values.gateway.tls.enabled | quote }}
            - name: AGENTTEAMS_GATEWAY_GRPC_TLS_CERTIFICATE_CHAIN
              value: {{ .Values.gateway.tls.certificateChainPath | quote }}
            - name: AGENTTEAMS_GATEWAY_GRPC_TLS_PRIVATE_KEY
              value: {{ .Values.gateway.tls.privateKeyPath | quote }}
            - name: AGENTTEAMS_GATEWAY_GRPC_TLS_TRUST_CERTIFICATE_COLLECTION
              value: {{ .Values.gateway.tls.trustCertificateCollectionPath | quote }}
            - name: AGENTTEAMS_GATEWAY_NATS_ENABLED
              value: {{ .Values.gateway.env.AGENTTEAMS_GATEWAY_NATS_ENABLED | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED
              value: {{ .Values.observability.tracing.enabled | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.observability.tracing.samplingProbability | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            - name: AGENTTEAMS_GATEWAY_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: AGENTTEAMS_GATEWAY_NATS_INSTANCE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.jdbcUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.gateway.tls.enabled }}
          volumeMounts:
            - name: agentteams-gateway-tls
              mountPath: {{ .Values.gateway.tls.mountPath | quote }}
              readOnly: true
{{- end }}
{{- if .Values.gateway.tls.enabled }}
      volumes:
        - name: agentteams-gateway-tls
          secret:
            secretName: {{ .Values.gateway.tls.secretName }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
  labels:
    app.kubernetes.io/part-of: agentteams
spec:
  selector: { app.kubernetes.io/name: agentteams-gateway }
  sessionAffinity: {{ .Values.gateway.sessionAffinity | default "None" }}
  ports:
    - { name: grpc, port: {{ .Values.gateway.port }}, targetPort: grpc }
    - { name: http, port: {{ .Values.gateway.httpPort }}, targetPort: http }
