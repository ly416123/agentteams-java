apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentteams-gateway }
    spec:
      serviceAccountName: {{ include "agentteams-java.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: {{ .Values.images.gateway }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: grpc, containerPort: {{ .Values.gateway.port }} }]
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.jdbcUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password }
            - name: AGENTTEAMS_GATEWAY_NATS_URL
              value: {{ .Values.nats.url | quote }}
          readinessProbe: { tcpSocket: { port: grpc } }
          livenessProbe: { tcpSocket: { port: grpc } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  selector: { app.kubernetes.io/name: agentteams-gateway }
  ports: [{ name: grpc, port: {{ .Values.gateway.port }}, targetPort: grpc }]
