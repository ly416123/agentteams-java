{{- if .Values.console.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentteams-java.fullname" . }}-console
  labels:
    app.kubernetes.io/name: agentteams-console
    app.kubernetes.io/part-of: agentteams
data:
  config.js: |
    window.__AGENTTEAMS_CONFIG__ = {{ .Values.console.config | toJson }};
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-console
  labels:
    app.kubernetes.io/name: agentteams-console
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-console }
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.console.config | sha256sum | quote }}
      labels:
        app.kubernetes.io/name: agentteams-console
        app.kubernetes.io/part-of: agentteams
    spec:
      securityContext:
{{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: console
          image: {{ .Values.console.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
{{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: console-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: console-config
          configMap:
            name: {{ include "agentteams-java.fullname" . }}-console
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentteams-java.fullname" . }}-console
  labels:
    app.kubernetes.io/name: agentteams-console
    app.kubernetes.io/part-of: agentteams
spec:
  selector: { app.kubernetes.io/name: agentteams-console }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- end }}
