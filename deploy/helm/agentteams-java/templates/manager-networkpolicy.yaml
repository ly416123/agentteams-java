{{- $manager := .Values.manager | default dict -}}
{{- if and $manager.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-manager
  labels:
    app.kubernetes.io/part-of: agentteams
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-manager }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
          podSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: {{ default 8080 $manager.port }} }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if $manager.modelEgressCIDR }}
    - to:
        - ipBlock: { cidr: {{ $manager.modelEgressCIDR | quote }} }
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
{{- if $manager.securityEgressCIDR }}
    - to:
        - ipBlock: { cidr: {{ $manager.securityEgressCIDR | quote }} }
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
{{- end }}
