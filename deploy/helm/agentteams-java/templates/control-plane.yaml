apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentteams-control-plane }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentteams-control-plane }
    spec:
      serviceAccountName: {{ include "agentteams-java.controlPlaneServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.controlPlane.teamSync.enabled }}
      containers:
        - name: control-plane
          image: {{ .Values.images.controlPlane }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.controlPlane.port }} }]
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.jdbcUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: password }
            - name: AGENTTEAMS_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED
              value: {{ .Values.observability.tracing.enabled | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.observability.tracing.samplingProbability | quote }}
            - name: AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT
              value: {{ .Values.observability.tracing.otlpEndpoint | quote }}
            - name: AGENTTEAMS_STORAGE_ENABLED
              value: {{ .Values.storage.enabled | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: AGENTTEAMS_SCHEDULER_ENABLED
              value: {{ .Values.controlPlane.scheduler.enabled | quote }}
            - name: AGENTTEAMS_SCHEDULER_POLL_INTERVAL_MS
              value: {{ .Values.controlPlane.scheduler.pollIntervalMs | quote }}
            - name: AGENTTEAMS_SCHEDULER_LEASE_DURATION
              value: {{ .Values.controlPlane.scheduler.leaseDuration | quote }}
            - name: AGENTTEAMS_SCHEDULER_BATCH_SIZE
              value: {{ .Values.controlPlane.scheduler.batchSize | quote }}
            - name: AGENTTEAMS_SECURITY_API_ENABLED
              value: {{ .Values.controlPlane.security.apiEnabled | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_ENABLED
              value: {{ .Values.controlPlane.security.oidc.enabled | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_ISSUER_URI
              value: {{ .Values.controlPlane.security.oidc.issuerUri | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_JWK_SET_URI
              value: {{ .Values.controlPlane.security.oidc.jwkSetUri | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_AUDIENCE
              value: {{ .Values.controlPlane.security.oidc.audience | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_TENANT_CLAIM
              value: {{ .Values.controlPlane.security.oidc.tenantClaim | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_PROJECT_CLAIM
              value: {{ .Values.controlPlane.security.oidc.projectClaim | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_TEAM_CLAIM
              value: {{ .Values.controlPlane.security.oidc.teamClaim | quote }}
            - name: AGENTTEAMS_SECURITY_OIDC_PERMISSIONS_CLAIM
              value: {{ .Values.controlPlane.security.oidc.permissionsClaim | quote }}
            - name: AGENTTEAMS_MATRIX_APPSERVICE_AUTH_ENABLED
              value: {{ .Values.controlPlane.matrix.appservice.authEnabled | quote }}
{{- if .Values.controlPlane.matrix.appservice.hsTokenSecret }}
            - name: AGENTTEAMS_MATRIX_APPSERVICE_HS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.matrix.appservice.hsTokenSecret }}
                  key: {{ .Values.controlPlane.matrix.appservice.hsTokenKey }}
{{- else }}
            - name: AGENTTEAMS_MATRIX_APPSERVICE_HS_TOKEN
              value: ""
{{- end }}
            - name: AGENTTEAMS_TEAM_SYNC_ENABLED
              value: {{ .Values.controlPlane.teamSync.enabled | quote }}
            - name: AGENTTEAMS_TEAM_SYNC_NAMESPACE
              value: {{ default .Release.Namespace .Values.controlPlane.teamSync.namespace | quote }}
{{- if .Values.storage.enabled }}
            - name: AGENTTEAMS_STORAGE_ENDPOINT
              value: {{ .Values.storage.endpoint | quote }}
            - name: AGENTTEAMS_STORAGE_BUCKET
              value: {{ .Values.storage.bucket | quote }}
            - name: AGENTTEAMS_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.storage.existingSecret }}, key: access-key }
            - name: AGENTTEAMS_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.storage.existingSecret }}, key: secret-key }
{{- end }}
          envFrom:
            - configMapRef: { name: {{ include "agentteams-java.fullname" . }}-control-plane }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/part-of: agentteams
spec:
  selector: { app.kubernetes.io/name: agentteams-control-plane }
  ports: [{ name: http, port: {{ .Values.controlPlane.port }}, targetPort: http }]
