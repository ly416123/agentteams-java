    {{- end }}
    {{- range .Values.networkPolicy.external.otlp }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- end }}
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports:
        - { protocol: TCP, port: 4318 }
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-operator }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.kubernetesApiAllowAllEgress }}
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
      {{- if .Values.networkPolicy.kubernetesApiEndpointCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiEndpointCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiEndpointPort }} }
      {{- end }}
    {{- end }}
{{- end }}
