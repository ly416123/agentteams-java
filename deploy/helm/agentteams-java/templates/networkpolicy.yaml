{{- if .Values.networkPolicy.enabled }}
{{- if .Values.sandbox.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-task-sandbox
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-task-sandbox }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-control-plane }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: agentteams-gateway }
        {{- if .Values.controlPlane.matrix.appservice.hsTokenSecret }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: tuwunel }
        {{- end }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
          podSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: postgresql }
      ports:
        - { protocol: TCP, port: 5432 }
    {{- if .Values.networkPolicy.databaseEgressCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseEgressCIDR | quote }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- end }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nats }
      ports:
        - { protocol: TCP, port: 4222 }
    {{- if .Values.networkPolicy.natsEgressCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.natsEgressCIDR | quote }}
      ports:
        - { protocol: TCP, port: 4222 }
    {{- end }}
    {{- if .Values.storage.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: minio }
      ports:
        - { protocol: TCP, port: 9000 }
      {{- if .Values.networkPolicy.storageEgressCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.storageEgressCIDR | quote }}
      ports:
        - { protocol: TCP, port: 9000 }
      {{- end }}
    {{- end }}
    {{- if eq .Values.networkPolicy.egressMode "CIDR" }}
    {{- range .Values.networkPolicy.external.postgresql }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.nats }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.objectStorage }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.otlp }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.oidc }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.matrix }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- range .Values.networkPolicy.external.modelProviders }}
    - to:
        - ipBlock: { cidr: {{ .cidr | quote }} }
      ports: [{ protocol: TCP, port: {{ .port }} }]
    {{- end }}
    {{- end }}
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports:
        - { protocol: TCP, port: 4318 }
    {{- end }}
    {{- if .Values.networkPolicy.dashboardAlertReceiver.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dashboard-alert-receiver }
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.dashboardAlertReceiver.port }} }
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if and .Values.controlPlane.security.oidc.enabled (not (gt (len .Values.networkPolicy.external.oidc) 0)) }}
    # Local Kind Keycloak uses HTTP inside the namespace; external providers
    # use the configured HTTPS egress CIDR and port below.
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports:
        - { protocol: TCP, port: 8080 }
      {{- if .Values.networkPolicy.oidcEgressCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.oidcEgressCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.oidcEgressPort }} }
      {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.kubernetesApiAllowAllEgress }}
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
      {{- if .Values.networkPolicy.kubernetesApiEndpointCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiEndpointCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiEndpointPort }} }
      {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
