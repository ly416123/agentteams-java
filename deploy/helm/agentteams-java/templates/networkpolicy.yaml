{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-control-plane }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
        {{- if .Values.storage.enabled }}
        - { protocol: TCP, port: 9000 }
        {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - {}
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
