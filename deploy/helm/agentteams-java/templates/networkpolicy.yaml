{{- if .Values.networkPolicy.enabled }}
{{- if .Values.sandbox.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-task-sandbox
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-task-sandbox }
  policyTypes: [Ingress, Egress]
  # Sandboxes do not accept inbound connections. Egress is limited to DNS;
  # a provider-specific allow-list must be added explicitly for workloads that
  # need model or artifact access.
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-control-plane }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: agentteams-gateway }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
          podSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
        {{- if .Values.storage.enabled }}
        - { protocol: TCP, port: 9000 }
        {{- end }}
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports:
        - { protocol: TCP, port: 4318 }
    {{- end }}
    {{- if .Values.networkPolicy.dashboardAlertReceiver.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dashboard-alert-receiver }
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.dashboardAlertReceiver.port }} }
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.controlPlane.security.oidc.enabled }}
    # Local Kind Keycloak uses HTTP inside the namespace; external providers
    # use the configured HTTPS egress CIDR and port below.
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.oidcEgressCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.oidcEgressPort }} }
    {{- end }}
    {{- if .Values.networkPolicy.kubernetesApiAllowAllEgress }}
    # Kind's node-level DNAT makes the API destination implementation-specific;
    # keep this development exception limited to Kubernetes API ports.
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
      {{- if .Values.networkPolicy.kubernetesApiEndpointCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiEndpointCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiEndpointPort }} }
      {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: {{ .Values.gateway.port }} }
        - { protocol: TCP, port: {{ .Values.gateway.httpPort }} }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports:
        - { protocol: TCP, port: 4318 }
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-operator
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-operator }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.kubernetesApiAllowAllEgress }}
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
      {{- if .Values.networkPolicy.kubernetesApiEndpointCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiEndpointCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiEndpointPort }} }
      {{- end }}
    {{- end }}
{{- end }}
