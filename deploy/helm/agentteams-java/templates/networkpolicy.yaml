{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-control-plane
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-control-plane }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        # 入口流量来自 ingress-nginx namespace
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
          podSelector:
            matchLabels: { app.kubernetes.io/name: ingress-nginx }
      ports:
        - { protocol: TCP, port: {{ .Values.controlPlane.port }} }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
        {{- if .Values.storage.enabled }}
        - { protocol: TCP, port: 9000 }
        {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.kubernetesApiAllowAllEgress }}
    # Kind's node-level DNAT makes the API destination implementation-specific;
    # keep this development exception limited to Kubernetes API ports.
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- else }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCIDR | quote }}
      ports:
        - { protocol: TCP, port: 443 }
      {{- if .Values.networkPolicy.kubernetesApiEndpointCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiEndpointCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.networkPolicy.kubernetesApiEndpointPort }} }
      {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentteams-java.fullname" . }}-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agentteams-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - {}
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
