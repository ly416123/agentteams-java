{{- if and .Values.ingress.enabled (eq .Values.ingress.mode "GATEWAY_API") }}
{{- $console := .Values.console | default dict -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "agentteams-java.fullname" . }}-public
spec:
  gatewayClassName: {{ required "ingress.gatewayClassName is required for GATEWAY_API" .Values.ingress.gatewayClassName | quote }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "ingress.tlsSecretName is required for GATEWAY_API" .Values.ingress.tlsSecretName | quote }}
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentteams-java.fullname" . }}-public
spec:
  parentRefs:
    - name: {{ include "agentteams-java.fullname" . }}-public
  hostnames: [{{ .Values.ingress.host | quote }}]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: {{ include "agentteams-java.fullname" . }}-control-plane
          port: {{ .Values.controlPlane.port }}
    {{- if $console.enabled }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "agentteams-java.fullname" . }}-console
          port: 8080
    {{- end }}
{{- end }}
