{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "agentteams-java.fullname" . }}
  labels:
    {{- toYaml .Values.observability.prometheusRule.labels | nindent 4 }}
spec:
  groups:
    - name: agentteams.recovery
      rules:
        - alert: AgentTeamsLeaseRecovery
          expr: increase(agentteams_tasks_leases_expired_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams task leases are expiring
            description: One or more task leases expired in the last 10 minutes and required recovery.
        - alert: AgentTeamsGatewayCommandDeduplication
          expr: increase(agentteams_gateway_commands_deduplicated_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams Gateway is deduplicating commands
            description: Outbox redelivery or Gateway retry caused duplicate command events in the last 10 minutes.
        - alert: AgentTeamsGatewayRejectedEvents
          expr: increase(agentteams_gateway_events_rejected_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams Gateway rejected inbound events
            description: The Gateway rejected one or more inbound Agent events in the last 10 minutes.
        - alert: AgentTeamsOutboxRetries
          expr: increase(agentteams_outbox_retries_total[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams Outbox events are retrying
            description: At least one Outbox event failed delivery in the last 10 minutes.
        - alert: AgentTeamsOutboxBacklog
          expr: agentteams_outbox_backlog > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams Outbox backlog is not draining
            description: One or more non-terminal Outbox events have remained in the relay backlog for 10 minutes.
        - alert: AgentTeamsOutboxStalled
          expr: agentteams_outbox_backlog > 0 and agentteams_outbox_oldest_pending_age_seconds > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: AgentTeams Outbox has a stalled oldest event
            description: The oldest non-terminal Outbox event has been pending for more than five minutes.
        - alert: AgentTeamsOutboxDeadLettered
          expr: increase(agentteams_outbox_dead_lettered_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: AgentTeams Outbox event moved to dead-letter
            description: At least one Outbox event exhausted its retry budget in the last 5 minutes.
        - alert: AgentTeamsGatewayNatsConsumerErrors
          expr: increase(agentteams_gateway_nats_consumer_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: AgentTeams Gateway NATS consumer is rejecting events
            description: The Gateway NATS consumer encountered event processing errors in the last 5 minutes.
        - alert: AgentTeamsGatewayConnectionChurn
          expr: increase(agentteams_gateway_connections_replaced_total[10m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AgentTeams Gateway connections are churning
            description: More than three active Agent streams were replaced in the last ten minutes.
        - alert: AgentTeamsConfigApplyFailures
          expr: increase(agentteams_config_apply_failed_total[10m]) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: AgentTeams configuration apply failed
            description: A Worker rejected or failed to apply configuration in the last ten minutes.
{{- end }}
