images:
  controlPlane: ghcr.io/ly416123/agentteams-control-plane:latest
  gateway: ghcr.io/ly416123/agentteams-agent-gateway:latest
  operator: ghcr.io/ly416123/agentteams-operator:latest
imagePullPolicy: IfNotPresent
controlPlane:
  replicas: 2
  port: 8080
  serviceAccount:
    create: true
    name: agentteams-control-plane
  teamSync:
    enabled: true
    # Empty means the Helm release namespace. Install one release per business
    # namespace; do not widen this to a cluster-wide informer without a new RBAC design.
    namespace: ""
  scheduler:
    enabled: true
    pollIntervalMs: 1000
    leaseDuration: 30s
    batchSize: 16
  security:
    apiEnabled: false
    oidc:
      enabled: false
      issuerUri: ""
      jwkSetUri: ""
      audience: ""
      tenantClaim: tenant
      projectClaim: project
      teamClaim: team
      permissionsClaim: permissions
  matrix:
    appservice:
      authEnabled: false
      hsTokenSecret: ""
      hsTokenKey: hs-token
  env:
    SPRING_PROFILES_ACTIVE: k8s
    AGENTTEAMS_NATS_ENABLED: "true"
    AGENTTEAMS_OUTBOX_RELAY_ENABLED: "true"
    AGENTTEAMS_CONFIG_SNAPSHOT_RETENTION_COUNT: "5"
    AGENTTEAMS_CONFIG_SNAPSHOT_CLEANUP_BATCH_SIZE: "25"
    AGENTTEAMS_CONFIG_SNAPSHOT_CLEANUP_INTERVAL_MS: "300000"
gateway:
  replicas: 2
  port: 9090
  httpPort: 8080
  serviceAccount:
    create: true
    name: agentteams-gateway
  tls:
    enabled: false
    secretName: agentteams-gateway-mtls
    mountPath: /etc/agentteams/gateway-tls
    certificateChainPath: /etc/agentteams/gateway-tls/tls.crt
    privateKeyPath: /etc/agentteams/gateway-tls/tls.key
    trustCertificateCollectionPath: /etc/agentteams/gateway-tls/ca.crt
  # AgentChannel is a long-lived gRPC stream. Keep reconnects for a worker on
  # the same Gateway replica when possible; durable DB ownership still handles
  # pod loss and cross-replica stale streams.
  sessionAffinity: ClientIP
  env:
    AGENTTEAMS_GATEWAY_GRPC_PORT: "9090"
    AGENTTEAMS_GATEWAY_NATS_ENABLED: "true"
    AGENTTEAMS_GATEWAY_NATS_URL: nats://nats:4222
  quota:
    # The Gateway exposes the gRPC quota contract only when this bridge is
    # enabled. Reservations remain durable in the Control Plane database.
    remoteEnabled: false
    controlPlaneUrl: ""
    internalToken: ""
    requestTimeout: 3s
operator:
  replicas: 1
  serviceAccount:
    create: true
    name: agentteams-operator
  leaderElection:
    enabled: true
    leaseName: agentteams-operator
database:
  jdbcUrl: jdbc:postgresql://postgresql:5432/agentteams
  username: agentteams
  existingSecret: agentteams-database
storage:
  enabled: false
  endpoint: http://minio:9000
  bucket: agentteams
  existingSecret: agentteams-storage
nats:
  url: nats://nats:4222
resources: {}
availability:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
networkPolicy:
  enabled: true
  # Allow the Control Plane to reach the configured OIDC issuer. This is only
  # rendered when OIDC is enabled; set a narrower CIDR for a production IdP.
  oidcEgressCIDR: 0.0.0.0/0
  oidcEgressPort: 443
  # Some CNIs evaluate Kind Service traffic after node-level DNAT. Keep the
  # default least-privilege rules unless a development cluster needs this
  # explicit API-port-only exception.
  kubernetesApiAllowAllEgress: false
  # Kubernetes' default Service CIDR; override for clusters using another CIDR.
  kubernetesApiCIDR: 10.96.0.0/12
  # The Service is DNATed to the API endpoint; set this when the CNI evaluates
  # the post-DNAT destination (Kind does this by default).
  kubernetesApiEndpointCIDR: ""
  kubernetesApiEndpointPort: 6443
observability:
  tracing:
    enabled: false
    samplingProbability: 0.1
    # Full OTLP HTTP traces endpoint, for example:
    # http://otel-collector:4318/v1/traces
    otlpEndpoint: ""
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
