apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: agentteams
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: agentteams
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.6
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm", "--http-port=8080", "--hostname-strict=false"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HEALTH_ENABLED
              value: "true"
            # The browser reaches Keycloak through the documented host
            # port-forward. Control Plane uses the internal JWK endpoint but
            # validates this externally visible issuer in the JWT.
            - name: KC_HOSTNAME
              value: http://127.0.0.1:18082
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/agentteams-realm.json
              subPath: agentteams-realm.json
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: agentteams
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
