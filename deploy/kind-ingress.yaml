apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentteams-local
  namespace: agentteams
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.agentteams.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentteams-agentteams-java-control-plane
                port:
                  name: http
    - host: gateway.agentteams.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentteams-agentteams-java-gateway
                port:
                  name: http
    - host: qwenpaw.agentteams.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qwenpaw
                port:
                  name: http
    - host: prometheus.agentteams.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  name: http
    - host: grafana.agentteams.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
