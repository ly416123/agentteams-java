apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwenpaw-openai-mock
  namespace: agentteams
  labels:
    app.kubernetes.io/name: qwenpaw-openai-mock
    app.kubernetes.io/part-of: agentteams
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwenpaw-openai-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwenpaw-openai-mock
        app.kubernetes.io/part-of: agentteams
    spec:
      containers:
        - name: openai-mock
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: server
              mountPath: /app/server.py
              subPath: server.py
      volumes:
        - name: server
          configMap:
            name: qwenpaw-openai-mock
---
apiVersion: v1
kind: Service
metadata:
  name: qwenpaw-openai-mock
  namespace: agentteams
  labels:
    app.kubernetes.io/name: qwenpaw-openai-mock
    app.kubernetes.io/part-of: agentteams
spec:
  selector:
    app.kubernetes.io/name: qwenpaw-openai-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
