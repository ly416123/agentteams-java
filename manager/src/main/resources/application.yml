spring:
  application:
    name: agentteams-manager
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  flyway:
    enabled: true
    table: manager_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/manager-migration
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
