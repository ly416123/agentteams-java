name: agentteams-java-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

# A new commit supersedes an older run on the same branch or pull request.
# This is especially important for the Kind jobs, which create a full cluster.
concurrency:
  group: agentteams-java-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate architecture map
        run: python scripts/validate-architecture-map.py
      - name: Validate API contract
        run: python scripts/validate-api-contract.py
      - name: Validate production values contract
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/validate-production-values.py
          python scripts/validate-matrix-registration.py
      - name: Validate backup and restore scripts
        run: bash scripts/validate-backup-scripts.sh
      - name: Validate production endpoint preflight script
        run: bash -n scripts/validate-production-endpoints.sh
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and integration tests
        run: mvn -q -Pintegration-tests verify
      - name: Helm lint
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/agentteams-java
      - run: helm template agentteams deploy/helm/agentteams-java >/tmp/agentteams-rendered.yaml

  kind-recovery:
    # Keep the fast verification job on every push, but run the expensive
    # Kubernetes recovery suite only for PRs, the default branch, this
    # acceptance branch, manual runs, and the weekly scheduled run.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
        (github.ref_name == github.event.repository.default_branch ||
         github.ref_name == 'codex/agentteams-java-foundation'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache grpcurl
        id: cache-grpcurl
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/grpcurl
          key: grpcurl-v1.9.3-linux-x86_64
      - name: Install grpcurl
        if: steps.cache-grpcurl.outputs.cache-hit != 'true'
        env:
          GRPCURL_VERSION: v1.9.3
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/bin"
          archive="grpcurl_${GRPCURL_VERSION#v}_linux_x86_64.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "/tmp/$archive" \
            "https://github.com/fullstorydev/grpcurl/releases/download/${GRPCURL_VERSION}/$archive"
          tar -xzf "/tmp/$archive" -C "$install_dir" grpcurl
          chmod +x "$install_dir/grpcurl"
      - name: Add grpcurl to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRPCURL_BIN=$HOME/.local/bin/grpcurl" >> "$GITHUB_ENV"
          "$HOME/.local/bin/grpcurl" -help >/dev/null
      - name: Install manifest validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: agentteams
          config: deploy/kind-config.yaml
          version: v0.25.0
          node_image: kindest/node:v1.31.0
      - name: Validate manifests
        run: |
          python scripts/validate-kind-infra.py
          python scripts/validate-kind-manifests.py
          python scripts/validate-observability.py
      - name: Install Kind dependencies
        run: |
          kubectl apply -f deploy/kind-dev-infra.yaml
          kubectl -n agentteams rollout status statefulset/postgresql --timeout=180s
          kubectl -n agentteams rollout status statefulset/nats --timeout=180s
          kubectl -n agentteams rollout status statefulset/minio --timeout=180s
          kubectl -n agentteams wait --for=condition=complete job/nats-stream-bootstrap job/minio-bucket-bootstrap --timeout=180s
          kubectl apply -f deploy/kind-observability.yaml
          kubectl -n agentteams rollout status deployment/prometheus --timeout=240s
          kubectl -n agentteams rollout status deployment/otel-collector --timeout=240s
          kubectl -n agentteams rollout status deployment/qwenpaw --timeout=240s
      - name: Configure deterministic QwenPaw model
        run: |
          set -euo pipefail
          kubectl -n agentteams create configmap qwenpaw-openai-mock \
            --from-file=server.py=scripts/qwenpaw-openai-mock.py \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/kind-qwenpaw-openai-mock.yaml
          kubectl -n agentteams rollout status deployment/qwenpaw-openai-mock --timeout=180s

          kubectl -n agentteams port-forward service/qwenpaw 18088:8088 >/tmp/qwenpaw-port-forward.log 2>&1 &
          qwenpaw_port_forward_pid=$!
          cleanup() {
            kill "$qwenpaw_port_forward_pid" >/dev/null 2>&1 || true
            wait "$qwenpaw_port_forward_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          models_file=/tmp/qwenpaw-models.json
          until curl -fsS http://127.0.0.1:18088/api/models -o "$models_file"; do sleep 2; done
          curl -fsS -X POST http://127.0.0.1:18088/api/models/custom-providers \
            -H 'Content-Type: application/json' \
            -d '{"id":"agentteams-ci","name":"AgentTeams CI Mock","default_base_url":"http://qwenpaw-openai-mock:8080/v1","api_key_prefix":"","chat_model":"OpenAIChatModel","models":[{"id":"agentteams-kind-mock","name":"agentteams-kind-mock","is_free":true}]}' \
            >/tmp/qwenpaw-custom-provider.json
          curl -fsS -X PUT http://127.0.0.1:18088/api/models/agentteams-ci/config \
            -H 'Content-Type: application/json' \
            -d '{"api_key":"agentteams-ci-mock","base_url":"http://qwenpaw-openai-mock:8080/v1","auto_discover":false}' \
            >/tmp/qwenpaw-custom-provider-config.json
          curl -fsS -X PUT http://127.0.0.1:18088/api/models/active \
            -H 'Content-Type: application/json' \
            -d '{"provider_id":"agentteams-ci","model":"agentteams-kind-mock","scope":"global"}' \
            >/tmp/qwenpaw-active-model.json
          jq -e '(.active_llm.provider_id == "agentteams-ci") and (.active_llm.model == "agentteams-kind-mock")' \
            /tmp/qwenpaw-active-model.json >/dev/null
          curl -fsS -X POST http://127.0.0.1:18088/api/models/agentteams-ci/models/test \
            -H 'Content-Type: application/json' \
            -d '{"model_id":"agentteams-kind-mock"}' \
            >/tmp/qwenpaw-model-test.json
          jq -e '.success == true' /tmp/qwenpaw-model-test.json >/dev/null
          echo 'QWENPAW_KIND_MOCK_OK provider=openai model=agentteams-kind-mock'
      - name: Build and load service images
        run: ./deploy/build-images.sh
      - name: Install AgentTeams chart
        run: |
          helm lint deploy/helm/agentteams-java
          helm template agentteams deploy/helm/agentteams-java \
            --set observability.prometheusRule.enabled=true >/tmp/agentteams-prometheusrule.yaml
          grep -q 'kind: PrometheusRule' /tmp/agentteams-prometheusrule.yaml
          grep -q 'AgentTeamsLeaseRecovery' /tmp/agentteams-prometheusrule.yaml
          python scripts/validate-prometheus-rule.py /tmp/agentteams-prometheusrule.yaml
          helm upgrade --install agentteams deploy/helm/agentteams-java \
            --namespace agentteams --create-namespace --wait --timeout 5m \
            --set controlPlane.security.apiEnabled=false \
            --set controlPlane.security.oidc.enabled=false \
            --set observability.tracing.enabled=true \
            --set observability.tracing.samplingProbability=1.0 \
            --set observability.tracing.otlpEndpoint=http://otel-collector:4318/v1/traces \
            -f deploy/helm/kind-values.yaml
          kubectl -n agentteams rollout status deployment/agentteams-agentteams-java-control-plane --timeout=300s
          kubectl -n agentteams rollout status deployment/agentteams-agentteams-java-gateway --timeout=300s
          kubectl -n agentteams rollout status deployment/agentteams-agentteams-java-operator --timeout=300s
      - name: Create real QwenPaw worker
        run: |
          set -euo pipefail
          kubectl -n agentteams port-forward service/agentteams-agentteams-java-control-plane 18080:8080 >/tmp/control-plane-port-forward.log 2>&1 &
          echo $! >/tmp/control-plane-port-forward.pid
          until curl -fsS http://127.0.0.1:18080/actuator/health >/dev/null; do sleep 2; done
          AGENT_RESPONSE=/tmp/agent-registration-response.json
          AGENT_STATUS=$(curl --silent --show-error --output "$AGENT_RESPONSE" --write-out '%{http_code}' \
            -X POST http://127.0.0.1:18080/api/v1/agents \
            -H 'Idempotency-Key: ci-kind-recovery-agent' \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-kind-recovery-agent","runtime":"qwenpaw","capabilities":{"qwenpaw":"true","java":"17"}}')
          if [[ "$AGENT_STATUS" != "201" ]]; then
            echo "agent registration failed with HTTP $AGENT_STATUS" >&2
            cat "$AGENT_RESPONSE" >&2
            exit 1
          fi
          AGENT_ID=$(jq -er '.id // empty' "$AGENT_RESPONSE")
          sed "s/00000000-0000-0000-0000-000000000001/$AGENT_ID/; s/name: qwenpaw-worker/name: qwenpaw-real/; s/AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED: \"false\"/AGENTTEAMS_OBSERVABILITY_TRACING_ENABLED: \"true\"/; s/AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY: \"0.1\"/AGENTTEAMS_OBSERVABILITY_TRACING_SAMPLING_PROBABILITY: \"1.0\"/; s#AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT: \"\"#AGENTTEAMS_OBSERVABILITY_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces#" \
            deploy/examples/qwenpaw-worker.yaml >/tmp/qwenpaw-real.yaml
          kubectl apply -f /tmp/qwenpaw-real.yaml
          deployment_deadline=$((SECONDS + 120))
          until kubectl -n agentteams get deployment/qwenpaw-real >/dev/null 2>&1; do
            if (( SECONDS >= deployment_deadline )); then
              echo "operator did not create deployment/qwenpaw-real" >&2
              exit 1
            fi
            sleep 2
          done
          kubectl -n agentteams rollout status deployment/qwenpaw-real --timeout=240s
          kubectl -n agentteams wait --for=jsonpath='{.status.phase}'=Ready worker/qwenpaw-real --timeout=240s
          agent_phase=""
          agent_deadline=$((SECONDS + 240))
          until [[ "$agent_phase" == "READY" ]]; do
            agent_phase=$(kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -At -c \
              "select phase from agents where id = '$AGENT_ID'" 2>/dev/null || true)
            if (( SECONDS >= agent_deadline )); then
              echo "registered agent did not become READY: id=$AGENT_ID phase=${agent_phase:-<missing>}" >&2
              exit 1
            fi
            sleep 2
          done
          echo "AGENTTEAMS_AGENT_ID=$AGENT_ID" >> "$GITHUB_ENV"
      - name: Run Kind quota recovery test
        run: |
          set -euo pipefail
          test -n "$AGENTTEAMS_AGENT_ID"
          python scripts/run-kind-quota-recovery.py
      - name: Run Kind resource binding ACK acceptance
        env:
          AGENTTEAMS_CONTROL_PLANE_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          test -n "$AGENTTEAMS_CONTROL_PLANE_URL"
          test -n "$AGENTTEAMS_AGENT_ID"
          python scripts/run-kind-resource-binding-ack.py \
            --base-url "$AGENTTEAMS_CONTROL_PLANE_URL" \
            --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind config rollback acceptance
        env:
          AGENTTEAMS_CONTROL_PLANE_URL: http://127.0.0.1:18080
        run: python scripts/run-kind-config-rollback.py
      - name: Run Kind resource binding ACK test
        env:
          AGENTTEAMS_CONTROL_PLANE_URL: http://127.0.0.1:18080
          AGENTTEAMS_AGENT_ID: ${{ env.AGENTTEAMS_AGENT_ID }}
        run: |
          set -euo pipefail
          python scripts/run-kind-resource-binding-ack.py \
            --base-url "$AGENTTEAMS_CONTROL_PLANE_URL" \
            --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind lease recovery test
        run: python scripts/run-kind-lease-recovery.py --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind task idempotency test
        run: python scripts/run-kind-idempotency.py
      - name: Run Kind NATS Outbox recovery test
        run: python scripts/run-kind-nats-outbox-recovery.py --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind Gateway replay recovery test
        run: python scripts/run-kind-gateway-replay.py --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind in-flight Worker restart recovery test
        run: python scripts/run-kind-worker-restart.py --agent-id "$AGENTTEAMS_AGENT_ID"
      - name: Run Kind PostgreSQL backup and restore validation
        run: python scripts/run-kind-postgres-restore.py
      - name: Run Kind MinIO backup and restore validation
        run: python scripts/run-kind-minio-restore.py
      - name: Run Kind object reference integrity validation
        run: python scripts/run-kind-object-reference-integrity.py
      - name: Verify OTLP trace continuity
        run: python scripts/validate-kind-otel.py
      - name: Verify multi-replica Prometheus scraping
        run: python scripts/validate-kind-prometheus.py
      - name: Run Kind Task and Artifact API smoke
        run: ./scripts/smoke-kind-task-api.sh
      - name: Collect Kind diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/agentteams-kind-recovery-diagnostics
          kubectl -n agentteams get pods -o wide > /tmp/agentteams-kind-recovery-diagnostics/pods.txt || true
          kubectl -n agentteams get deployments -o wide > /tmp/agentteams-kind-recovery-diagnostics/deployments.txt || true
          kubectl -n agentteams get events --sort-by=.lastTimestamp > /tmp/agentteams-kind-recovery-diagnostics/events.txt || true
          cp /tmp/agent-registration-response.json /tmp/agentteams-kind-recovery-diagnostics/agent-registration-response.json 2>/dev/null || true
          cp /tmp/control-plane-port-forward.log /tmp/agentteams-kind-recovery-diagnostics/control-plane-port-forward.log 2>/dev/null || true
          kubectl -n agentteams get prometheusrule -o yaml > /tmp/agentteams-kind-recovery-diagnostics/prometheusrules.yaml || true
          kubectl -n agentteams get worker/qwenpaw-real -o yaml > /tmp/agentteams-kind-recovery-diagnostics/worker.yaml || true
          kubectl -n agentteams describe worker/qwenpaw-real > /tmp/agentteams-kind-recovery-diagnostics/worker-describe.txt 2>&1 || true
          kubectl -n agentteams get deployment/qwenpaw-real -o yaml > /tmp/agentteams-kind-recovery-diagnostics/qwenpaw-real.yaml || true
          kubectl -n agentteams logs deployment/qwenpaw-real --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/worker.log 2>&1 || true
          kubectl -n agentteams logs deployment/qwenpaw --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/qwenpaw.log 2>&1 || true
          kubectl -n agentteams logs deployment/qwenpaw-openai-mock --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/qwenpaw-openai-mock.log 2>&1 || true
          kubectl -n agentteams logs deployment/otel-collector --tail=1000 > /tmp/agentteams-kind-recovery-diagnostics/otel-collector.log 2>&1 || true
          kubectl -n agentteams logs statefulset/nats --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/nats.log 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select event_type,status,attempts,last_error,created_at,updated_at from outbox_events order by updated_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/outbox-events.txt 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select agent_id,sequence,event_id,created_at from gateway_commands order by created_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/gateway-commands.txt 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select agent_id,last_ack_sequence,updated_at from gateway_ack_cursors order by updated_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/gateway-ack-cursors.txt 2>&1 || true
          kubectl -n agentteams logs deployment/agentteams-agentteams-java-operator --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/operator.log 2>&1 || true
          kubectl -n agentteams get pods -l app.kubernetes.io/name=agentteams-worker -o yaml > /tmp/agentteams-kind-recovery-diagnostics/worker-pods.yaml || true
          kubectl -n agentteams logs deployment/agentteams-agentteams-java-control-plane --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/control-plane.log 2>&1 || true
          kubectl -n agentteams logs deployment/agentteams-agentteams-java-gateway --tail=300 > /tmp/agentteams-kind-recovery-diagnostics/gateway.log 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select event_type,aggregate_id,created_at,payload from domain_events order by created_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/domain-events.txt 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select tenant_id,project_id,current_concurrent_calls,daily_calls,daily_tokens,max_concurrent_calls,max_daily_calls,max_daily_tokens,usage_day,updated_at from project_quota_policies order by updated_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/quota-policies.txt 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select reservation_id,tenant_id,project_id,acquire_idempotency_key,estimated_tokens,state,created_at,updated_at from quota_reservations order by updated_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/quota-reservations.txt 2>&1 || true
          kubectl -n agentteams exec postgresql-0 -- psql -U agentteams -d agentteams -c \
            "select tenant_id,project_id,reservation_id,idempotency_key,accepted,protocol_error,created_at from quota_reservation_releases order by created_at desc limit 200" \
            > /tmp/agentteams-kind-recovery-diagnostics/quota-releases.txt 2>&1 || true
      - name: Upload Kind recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-recovery-diagnostics
          path: /tmp/agentteams-kind-recovery-diagnostics
          if-no-files-found: warn
          retention-days: 14

  kind-oidc:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' &&
        (github.ref_name == github.event.repository.default_branch ||
         github.ref_name == 'codex/agentteams-java-foundation'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: agentteams
          config: deploy/kind-config.yaml
          version: v0.25.0
          node_image: kindest/node:v1.31.0
      - name: Install Kind dependencies
        run: |
          kubectl apply -f deploy/kind-dev-infra.yaml
          kubectl -n agentteams rollout status statefulset/postgresql --timeout=180s
          kubectl -n agentteams rollout status statefulset/nats --timeout=180s
          kubectl -n agentteams rollout status statefulset/minio --timeout=180s
          kubectl -n agentteams wait --for=condition=complete job/nats-stream-bootstrap job/minio-bucket-bootstrap --timeout=180s
      - name: Build and load service images
        run: ./deploy/build-images.sh
      - name: Install CRDs and local OIDC
        run: |
          kubectl apply -f deploy/helm/agentteams-java/crds/teams.yaml
          kubectl apply -f deploy/helm/agentteams-java/crds/workers.yaml
          ./deploy/install-kind-oidc.sh
      - name: Verify live JWKS key rotation
        run: ./scripts/smoke-kind-oidc-rotation.sh
      - name: Install and verify local Tuwunel AppService
        run: |
          ./deploy/install-kind-matrix.sh
          ./scripts/smoke-kind-matrix.sh
      - name: Collect OIDC diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/agentteams-kind-oidc-diagnostics
          kubectl -n agentteams get pods -o wide > /tmp/agentteams-kind-oidc-diagnostics/pods.txt || true
          kubectl -n agentteams get deployments -o wide > /tmp/agentteams-kind-oidc-diagnostics/deployments.txt || true
          kubectl -n agentteams get events --sort-by=.lastTimestamp > /tmp/agentteams-kind-oidc-diagnostics/events.txt || true
          kubectl -n agentteams logs deployment/keycloak --tail=300 > /tmp/agentteams-kind-oidc-diagnostics/keycloak.log 2>&1 || true
          kubectl -n agentteams logs deployment/tuwunel --tail=300 > /tmp/agentteams-kind-oidc-diagnostics/tuwunel.log 2>&1 || true
          kubectl -n agentteams logs deployment/agentteams-agentteams-java-control-plane --tail=300 > /tmp/agentteams-kind-oidc-diagnostics/control-plane.log 2>&1 || true
      - name: Upload OIDC diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-oidc-diagnostics
          path: /tmp/agentteams-kind-oidc-diagnostics
          if-no-files-found: warn
          retention-days: 14
