name: agentteams-java-release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: agentteams-java-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io/ly416123
  COSIGN_EXPERIMENTAL: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Pin pip for hashed isolated build constraints
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements/pip-installer-py312.lock

      - name: Install Python verification dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --build-constraint requirements/release-ci-py312.lock
          -r requirements/release-ci-py312.lock

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.2.4

      - name: Set up Go for MinIO test images
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.6'
          cache: false

      - name: Build pinned MinIO test images
        run: ./scripts/build-kind-minio-images.sh

      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "RELEASE_TAG_INVALID: expected a stable vX.Y.Z tag" >&2
            exit 1
          fi

      - name: Verify tag points at main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify clean source context and calculate fingerprint
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --exclude-standard)"
          source_fingerprint="$(python3 scripts/source-fingerprint.py fingerprint --root .)"
          echo "SOURCE_FINGERPRINT=$source_fingerprint" >> "$GITHUB_ENV"

      - name: Run release verification gates
        run: |
          set -euo pipefail
          java -version
          mvn --version
          helm version --short
          python3 -m unittest discover -s scripts -p 'test_*.py'
          mvn -q -Pintegration-tests clean verify
          helm lint deploy/helm/agentteams-java

      - name: Publish versioned shared core Maven artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"

          maven_artifacts=(
            agentteams-java:pom
            agentteams-contracts:pom agentteams-contracts:jar
            agentteams-domain:pom agentteams-domain:jar
            agentteams-application-contracts:pom agentteams-application-contracts:jar
            agentteams-observability:pom agentteams-observability:jar
            agentteams-storage:pom agentteams-storage:jar
            agentteams-runtime:pom agentteams-runtime:jar
          )
          published_artifacts=()
          maven_repository="https://maven.pkg.github.com/ly416123/agentteams-java"
          # Validate the workflow token and repository access before treating
          # Maven 404 responses as absent artifacts. The package must grant
          # this source repository write access (or inherit repository access).
          curl --fail --silent --show-error --netrc-file /dev/null \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" >/dev/null
          for artifact in "${maven_artifacts[@]}"; do
            package="${artifact%%:*}"
            extension="${artifact##*:}"
            artifact_file="$package-$release_version.$extension"
            artifact_url="$maven_repository/io/agentteams/$package/$release_version/$artifact_file"
            http_status="$(curl --silent --show-error --location --max-redirs 3 \
              --proto-redir '=https' --netrc-file /dev/null \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              --output /dev/null --write-out '%{http_code}' "$artifact_url")"
            case "$http_status" in
              200) published_artifacts+=("$artifact") ;;
              404) ;;
              *)
                echo "MAVEN_PACKAGE_PREFLIGHT_FAILED: $artifact returned HTTP $http_status" >&2
                exit 1
                ;;
            esac
          done

          publication_state="$(python3 scripts/check-maven-publication.py \
            --expected "${maven_artifacts[@]}" \
            --published "${published_artifacts[@]}")"
          if [[ "$publication_state" == "SKIP" ]]; then
            echo "Maven artifacts for $release_version are already complete; skipping republish."
            exit 0
          fi

          maven_source="$RUNNER_TEMP/agentteams-maven-source"
          mkdir -p "$maven_source"
          git archive "$GITHUB_SHA" | tar -x -C "$maven_source"
          cd "$maven_source"

          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="$release_version" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false \
            -DupdateMatchingVersions=true

          # Publish from the temporary source copy so the tagged checkout and
          # its source fingerprint remain untouched for image provenance below.
          mvn --batch-mode -DskipTests \
            -pl .,contracts,domain,application-contracts,observability,storage,runtime \
            -am deploy

      - name: Install Cosign
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build, sign, and attest service images
        id: images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declare -a components=(
            "control-plane|deploy/docker/control-plane.Dockerfile|agentteams-control-plane"
            "gateway|deploy/docker/gateway.Dockerfile|agentteams-agent-gateway"
            "operator|deploy/docker/operator.Dockerfile|agentteams-operator"
            "worker|deploy/docker/worker.Dockerfile|agentteams-agent-worker"
          )

          mkdir -p "$RUNNER_TEMP/release"
          for entry in "${components[@]}"; do
            IFS='|' read -r component dockerfile repository <<<"$entry"
            image="$REGISTRY/$repository"
            metadata="$RUNNER_TEMP/release/$component-metadata.json"
            sbom="$RUNNER_TEMP/release/$component-sbom.json"
            provenance="$RUNNER_TEMP/release/$component-provenance.json"

            docker buildx build \
              --platform linux/amd64 \
              --file "$dockerfile" \
              --tag "$image:$RELEASE_TAG" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "io.agentteams.source-fingerprint=$SOURCE_FINGERPRINT" \
              --provenance=true \
              --sbom=true \
              --metadata-file "$metadata" \
              --push .
            digest="$(jq -er '."containerimage.digest"' "$metadata")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            # Buildx emits its own SBOM/provenance attestations. Also publish a
            # small CycloneDX predicate whose subject is the exact image
            # digest, so promotion can verify a stable, typed attestation.
            jq -n \
              --arg name "$image" \
              --arg digest "$digest" \
              --arg source_fingerprint "$SOURCE_FINGERPRINT" \
              '{bomFormat:"CycloneDX", specVersion:"1.5", version:1,
                metadata:{component:{type:"container", name:$name, version:$digest}},
                components:[{type:"container", name:$name, version:$digest,
                  properties:[{name:"io.agentteams.source-fingerprint", value:$source_fingerprint}]}]}' \
              > "$sbom"
            jq -n \
              --arg subject "$image@$digest" \
              --arg digest "${digest#sha256:}" \
              --arg git_sha "$GITHUB_SHA" \
              --arg source_fingerprint "$SOURCE_FINGERPRINT" \
              --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              '{_type:"https://in-toto.io/Statement/v1",
                subject:[{name:$subject, digest:{sha256:$digest}}],
                predicateType:"https://slsa.dev/provenance/v1",
                predicate:{buildDefinition:{buildType:$workflow,
                  externalParameters:{gitSha:$git_sha, sourceFingerprint:$source_fingerprint,
                    resolvedDependencies:[]},
                  runDetails:{builder:{id:$workflow}, metadata:{invocationId:$git_sha}}}}' \
              > "$provenance"
            cosign sign --yes "$image@$digest"
            cosign attest --yes --predicate "$sbom" --type cyclonedx "$image@$digest"
            cosign attest --yes --predicate "$provenance" --type slsaprovenance "$image@$digest"

            jq -n \
              --arg image "$image@$digest" \
              --arg component "$component" \
              --arg source_fingerprint "$SOURCE_FINGERPRINT" \
              --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '{component:$component, image:$image,
                source_fingerprint:$source_fingerprint,
                sbom:($repository + "/attestations/" + $component + "-sbom"),
                signature:($repository + "/attestations/" + $component + "-signature"),
                provenance:($repository + "/attestations/" + $component + "-provenance")}' \
              > "$RUNNER_TEMP/release/$component.json"
          done

      - name: Create and validate release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg source_fingerprint "$SOURCE_FINGERPRINT" \
            --arg chart_version "$chart_version" \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --slurpfile control_plane "$RUNNER_TEMP/release/control-plane.json" \
            --slurpfile gateway "$RUNNER_TEMP/release/gateway.json" \
            --slurpfile operator "$RUNNER_TEMP/release/operator.json" \
            --slurpfile worker "$RUNNER_TEMP/release/worker.json" \
            '{schema_version:1, git_sha:$git_sha, source_fingerprint:$source_fingerprint,
              chart_source_fingerprint:$source_fingerprint, chart_version:$chart_version,
              environment:"production",
              components:{
                "control-plane":$control_plane[0], gateway:$gateway[0],
                operator:$operator[0], worker:$worker[0]},
              manifest_signature:{
                bundle:($repository + "/releases/download/" + $release_tag + "/release-manifest.json.sig"),
                issuer:"https://token.actions.githubusercontent.com",
                identity:($repository + "/.github/workflows/release.yml")}}' \
            > release-manifest.json
          python3 scripts/validate-release-manifest.py \
            --manifest release-manifest.json \
            --git-sha "$GITHUB_SHA" \
            --environment production \
            --source-fingerprint "$SOURCE_FINGERPRINT"
          cosign sign-blob --yes --bundle release-manifest.json.sig release-manifest.json

      - name: Package and sign Helm chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/release"
          helm package deploy/helm/agentteams-java \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination "$RUNNER_TEMP/release"
          chart="$RUNNER_TEMP/release/agentteams-java-$chart_version.tgz"
          test -s "$chart"
          cosign sign-blob --yes \
            --bundle "$chart.sig" \
            "$chart"

      - name: Publish signed release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-manifest.json release-manifest.json.sig \
            "$RUNNER_TEMP/release/agentteams-java-${RELEASE_TAG#v}.tgz" \
            "$RUNNER_TEMP/release/agentteams-java-${RELEASE_TAG#v}.tgz.sig" \
            --title "AgentTeams $RELEASE_TAG" \
            --generate-notes
